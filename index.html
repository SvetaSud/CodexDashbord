<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c1a;--panel:#11142a;--panel2:#161a35;--line:#232849;--line2:#2e3460;
  --text:#e9ebf8;--muted:#8a90b4;--dim:#5d6388;
  --blue:#4f7cff;--violet:#8b5cf6;--cyan:#22d3ee;--green:#22c55e;--red:#ef4444;--amber:#f5a524;
  --grad:linear-gradient(135deg,#4f7cff,#8b5cf6);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue);text-decoration:none;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#0d1022;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:22px;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 0 24px #6a5cff66}
.brand b{font-size:19px;display:block}
.brand small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#c3c7e2;text-align:left;border:1px solid transparent}
.nav button:hover{background:var(--panel2)}
.nav button.on{background:linear-gradient(90deg,#4f7cff22,#8b5cf622);border-color:#4f7cff66;color:#fff}
.nav .badge{margin-left:auto}
.badge{background:var(--violet);color:#fff;font-size:11px;font-weight:600;border-radius:7px;padding:1px 7px;min-width:20px;text-align:center}
.ai-btn{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);text-align:left}
.ai-btn:hover{border-color:var(--violet)}
.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5b4ff,#6d4cff 55%,#2a1f7a);box-shadow:0 0 18px #7c5cff99;flex:none}
.ai-btn b{display:block}.ai-btn small{color:var(--muted);font-size:12px}
.main{min-width:0;padding:22px 28px 40px}
.scrim{display:none}

/* header */
.top{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap}
.burger{display:none;width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);place-items:center}
.hello{display:flex;gap:14px;align-items:center;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#6366f1);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.hello h1{font-size:22px;font-weight:700;white-space:nowrap}
.hello p{color:var(--muted);font-size:13px}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 40px;outline:none}
.search input:focus{border-color:var(--blue)}
.search>svg{position:absolute;left:13px;top:12px;color:var(--muted)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px;z-index:30;max-height:360px;overflow:auto;display:none;box-shadow:0 20px 40px #0008}
.sres.show{display:block}
.sres button{display:flex;width:100%;gap:10px;padding:9px 10px;border-radius:8px;text-align:left;align-items:center}
.sres button:hover{background:#ffffff0d}
.sres small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.sres .empty{padding:10px;color:var(--muted)}
.src{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.src>span{color:var(--muted);font-size:13px}
.chip{font-size:12px;font-weight:600;border-radius:8px;padding:4px 10px;border:1px solid var(--line2);background:var(--panel)}
.chip.oz{background:#1f5eff;border-color:#4f7cff}
.chip.demo{color:var(--amber);border-color:#f5a52466;background:#f5a52412}
.chip.live{color:#6ee79a;border-color:#22c55e66;background:#22c55e14}
.chip.test{color:var(--cyan);border-color:#22d3ee66;background:#22d3ee12}
.chip.off{opacity:.45}
.chip.err{color:#ff8a8a;border-color:#ef444466;background:#ef444414}
.dtag{font-size:10px;font-weight:600;color:var(--amber);border:1px solid #f5a52466;border-radius:6px;padding:1px 6px;letter-spacing:.02em}
.sync{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-bottom:16px}
.sync b{color:var(--amber);font-weight:600}
.sync button{display:flex;align-items:center;gap:6px;color:var(--muted);padding:4px 8px;border-radius:8px}
.sync button:hover{color:var(--text);background:var(--panel)}

/* cards */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card h3 .ico{width:30px;height:30px;border-radius:9px;background:#ffffff0a;display:grid;place-items:center;color:var(--blue)}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px}
.card h3 .more{margin-left:auto;font-size:12px;font-weight:500}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.up{color:var(--green)}.down{color:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.row span:first-child{color:var(--muted)}
.row b{font-weight:600}
.click{cursor:pointer;transition:border-color .15s}
.click:hover{border-color:var(--line2)}

.home{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font-size:26px;font-weight:700;margin:6px 0 10px;white-space:nowrap}
.kpi .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.kpi .foot span{font-weight:600;font-size:14px;white-space:nowrap}
.kpi .foot svg{width:48%;max-width:110px;height:auto}
.kpi .foot small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.mid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.bar{height:10px;border-radius:6px;background:#ffffff10;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.plan-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.plan-top .big{font-size:24px;font-weight:700}
.plan-top .right{text-align:right}
.plan-top .right b{font-size:20px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-left:auto;font-weight:400;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart svg{width:100%;height:auto;display:block}
.chart svg .hit:hover{fill:#ffffff0d}
.charts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#tip{position:fixed;z-index:99;pointer-events:none;background:#1b1f3b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;color:var(--text);box-shadow:0 6px 20px #0008;display:none}
.ch-row{margin-bottom:14px}
.ch-row .row{padding:0 0 6px}
.ch-row .row span:first-child{color:var(--text)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cards3>.card:last-child:nth-child(3n+1){grid-column:1/-1}
.cards3.c4{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.cards3.c4>.card .row{padding:5px 0}
.cards3.c4>.card:last-child:nth-child(3n+1){grid-column:auto}
.pay-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pay-box{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff05}
.pay-box small{color:var(--muted);font-size:12px}
.pay-box b{font-size:18px}
.pay-box span{font-size:12px;color:var(--muted)}
.pay-box.soon{border-color:#f5a52488;background:#f5a5240f}
.pay-box.soon small{color:var(--amber)}
.pay{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff08}
.pay:last-child{border:0}
.pay small{display:block;color:var(--muted);font-size:11px;text-align:right}
.pay .dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);margin-right:7px}
.pay.soon .dot{border-color:var(--amber);background:var(--amber)}
.big2{font-size:26px;font-weight:700;margin:4px 0 8px}
.ring{--p:50;--c:var(--cyan);width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#ffffff12 0);display:grid;place-items:center;flex:none}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:16px}
.flexc{display:flex;align-items:center;gap:16px;justify-content:space-between}
.trf{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.trf ul{list-style:none}
.trf li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}

.ins{border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;border:1px solid;cursor:pointer;text-align:left;width:100%}
.ins.high{background:#ef44441a;border-color:#ef444455}.ins.med{background:#f5a5241a;border-color:#f5a52455}.ins.low{background:#22c55e14;border-color:#22c55e44}
.ins .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ins.high .mk{background:var(--red)}.ins.med .mk{background:var(--amber);color:#111}.ins.low .mk{background:var(--green);color:#062}
.ins .pr{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;margin-top:6px}
.ins.high .pr{background:#ef444433;color:#ff8a8a}.ins.med .pr{background:#f5a52433;color:#ffc766}.ins.low .pr{background:#22c55e2b;color:#6ee79a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;border:1px solid var(--line2);background:var(--panel2)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 20px #5b5cff44}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{color:#ff8a8a;border-color:#ef444455}
.btn.full{width:100%}
.list button.li{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid #ffffff08;text-align:left}
.list button.li:last-child{border:0}
.list button.li:hover{color:#fff}
.list .rd{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.list .ch{margin-left:auto;color:var(--dim)}
.qa button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border-bottom:1px solid #ffffff08}
.qa button:last-child{border:0}
.qa button:hover{color:#fff}.qa button:hover svg{color:var(--blue)}
.doc{display:flex;gap:12px;align-items:center;padding:8px 0}
.ft{width:34px;height:34px;border-radius:8px;background:#ef44441f;color:#ff7a8a;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.doc b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc small{color:var(--muted);font-size:12px}
.tsub{color:var(--muted);font-size:13px}
.tsub b{font-weight:600}
/* Склад: компактная таблица — все колонки на одном экране, название товара в одну строку с многоточием */
table.stock th,table.stock td{padding:7px 8px}
table.stock th{white-space:normal;line-height:1.2;vertical-align:bottom}
table.stock td:first-child{max-width:200px;min-width:150px}
table.stock td:first-child small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.stock .tag{white-space:normal;line-height:1.2}
.taxlink{cursor:pointer;border-bottom:1px dashed currentColor;color:var(--accent,#4f7cff)}
.taxlink:hover{opacity:.8}
table.taxcalc tr.hl td{background:#4f7cff1a}
a.card.kpi{color:inherit;text-decoration:none;display:block}
.kpi.alarm{border-color:#ef4444;background:linear-gradient(#ef44441f,#ef44440d)}
.alarm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:6px;vertical-align:middle;animation:alarmPulse 1.4s infinite}
@keyframes alarmPulse{50%{opacity:.3}}
.split{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:12px;background:#ffffff10}
.split i{display:block}
tr.loss td{background:#ef44440f}
.cheap-banner{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border:1px solid #f97316;background:linear-gradient(#f973161f,#f973160d);border-radius:12px;padding:12px 14px;margin-bottom:16px;cursor:pointer}
.cheap-banner .alarm-dot{background:#f97316}
.cheap-art{background:#f97316;color:#fff;padding:1px 6px;border-radius:5px;font-weight:700;white-space:nowrap}
.cheap-banner.arch{border-color:#a855f7;background:linear-gradient(#a855f71f,#a855f70d)}
.cheap-banner.arch .alarm-dot{background:#a855f7}
.arch-art{background:#a855f7;color:#fff;padding:1px 6px;border-radius:5px;font-weight:700;white-space:nowrap}
.settle2{display:grid;grid-template-columns:minmax(0,0.75fr) minmax(0,1.6fr);gap:16px;align-items:start}
@media (max-width:900px){.settle2{grid-template-columns:1fr}}
table.settle-m td.r{white-space:nowrap}
tr.tot td{background:#0e1124;font-weight:600;border-top:1px solid var(--line2)}
table.unit td small{font-size:11px}
table.ozon th.grp{text-align:center;border-bottom:1px solid var(--line2);color:var(--text);font-weight:600}
/* Широкие таблицы (юнит-экономика, кластеры): прокрутка внутри окна высотой с экран — шапка и левая колонка
   закреплены, а горизонтальная полоса прокрутки всегда видна внизу окна. Ширина колонок — по содержимому. */
.tbl-wrap.fix{overflow:auto;max-height:calc(100vh - 150px)}
.tbl-wrap.mini{overflow:auto;max-height:340px}
.tbl-wrap.fix>table,.tbl-wrap.mini>table{border-collapse:separate;border-spacing:0}
table.ozon{width:auto;min-width:0;border-collapse:separate;border-spacing:0}
table.ozon th,table.ozon td{padding:7px 9px}
table.ozon th{white-space:normal;vertical-align:bottom;line-height:1.25;max-width:110px}
table.ozon thead tr:first-child th{height:32px;top:0;z-index:2}
table.ozon th.grp{max-width:none;white-space:nowrap}
table.ozon.ptab .stick{min-width:0;max-width:none;white-space:nowrap}
table.ptab thead th{top:0;z-index:2}
table.ptab thead th.stick{z-index:5}
table.ozon td.stick small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.ozon thead tr:nth-child(2) th{top:32px;z-index:2}
table.ozon thead tr:first-child th.stick{z-index:5;top:0}
table.ozon .stick{position:sticky;left:0;z-index:1;background:var(--card,#11142a);min-width:160px;max-width:220px;white-space:normal}
table.ozon tr.loss .stick{background:#2a1424}
table.ozon tr.tot .stick{background:#0e1124}
table.clt th.cl,table.clt td.cl{border-left:2px solid var(--line2)}
table.clt th{min-width:70px;font-size:11px}
table.clt td.pod,table.clt th.pod{background:#ef44440d}
table.clt tr.sub td{background:#ffffff06}
td.warn{color:var(--amber)}
.chip2{font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);white-space:nowrap}
.rows-set{position:relative}
.rows-set summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.rows-set summary::-webkit-details-marker{display:none}
.rows-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;display:grid;gap:6px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px #0008;min-width:260px}
table.ozon.rnp td.stick{white-space:nowrap;font-weight:500;min-width:0;max-width:none}
table.ozon.rnp th.stick{min-width:0;max-width:none}
table.rnp .tot2{background:#ffffff06}
table.rnp td{white-space:nowrap}
table.rnp small.dl{font-size:11px;font-weight:600;margin-left:4px}
table.rnp tr.grp-row td{background:#1b2040;font-weight:700;font-size:12px;letter-spacing:.04em;cursor:pointer;color:var(--text)}
table.rnp tr.grp-row td.stick{background:#1b2040}
table.rnp tr.grp-row .caret{display:inline-block;width:14px;color:var(--muted)}
input.pin{width:56px;padding:4px 6px;text-align:right;font-weight:600;background:#ffffff08;border:1px solid var(--line);border-radius:6px;color:var(--text)}
input.pin:focus{outline:none;border-color:var(--blue)}
input.pin.ed{border-color:var(--amber);background:#f5a52418}
.cl-sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.cl-sheet table td{white-space:normal}
table.pf{min-width:0}
table.pf th,table.pf td{padding:7px 10px;white-space:normal}
table.pf td small{font-size:11px}
#modal:has(table.pf){width:min(760px,96vw);max-width:none}
td.pcell{cursor:pointer}
td.pcell:hover{text-decoration:underline;background:#4f7cff14}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pnl-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
table.pnl{min-width:0}
table.pnl td{white-space:normal}
table.pnl tr.sub td{font-weight:600;background:#ffffff06}
table.pnl tr.mb td{color:var(--muted);font-size:13px}
table.pnl tr.tot td{font-size:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;border-radius:8px;padding:4px 0}
.bar-col.on{background:#ffffff08}
.bar-col small{color:var(--muted);font-size:11px}
.bar-col .bl{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.bv{width:70%;max-width:42px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#22c55e,#16a34a)}
.bv.neg{background:linear-gradient(180deg,#ef4444,#b91c1c)}
.ppgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pp{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.pp b{color:var(--text);font-size:14px}
.ppin{position:relative;display:block}
.ppin input{width:100%;padding-right:30px}
.ppin i{position:absolute;right:11px;top:9px;font-style:normal;color:var(--muted)}
.docsum{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.doc div{min-width:0}

/* pages */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h2{font-size:22px}
.ph .sp{flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px;text-align:left}
.stat small{color:var(--muted);display:block;font-size:12px}

.stat.on{border-color:var(--blue);background:#4f7cff14}
.stat.ret{cursor:pointer;font:inherit;color:inherit;max-width:190px}
.stat.ret b{display:block;font-size:18px}
.stat.ret span{font-size:12px}
.stat.ret.bad b{color:var(--red,#d93636)}
tr.hot td{background:#d936360d}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;min-width:0}

.kc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;user-select:none}
.kc:hover{border-color:var(--line2)}
.kc.drag{opacity:.4}
.kc b{display:block;font-weight:600;margin-bottom:8px}
.kc .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;background:#ffffff10;color:#c7cbe6;white-space:nowrap}
.tag.high{background:#ef444426;color:#ff8f8f}.tag.med{background:#f5a52426;color:#ffc35c}.tag.low{background:#22c55e22;color:#6ee79a}

.kc .mv button:hover{color:var(--text);background:#ffffff14}
.ksum{font-size:13px;color:var(--cyan);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #ffffff0a;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;background:#0e1124;position:sticky;top:0}
tr:last-child td{border:0}
td.r,th.r{text-align:right}
td select{padding:5px 8px;font-size:13px}
.st{font-size:12px;border-radius:7px;padding:3px 9px;font-weight:500}

.st.new{background:#4f7cff26;color:#8eaaff}.st.ok{background:#22c55e22;color:#6ee79a}.st.sign{background:#f5a52426;color:#ffc35c}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap;margin-bottom:16px;width:fit-content;max-width:100%}
.tabs button{padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.tabs .badge{margin-left:6px;background:#ffffff1a}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px}
.dc .top2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dc h4{font-size:17px;margin-bottom:8px}
.dc p{color:#c3c7e2;margin-bottom:10px}

.dc ol li.done{color:var(--dim);text-decoration:line-through}

.dc .facts div{background:#ffffff08;border-radius:10px;padding:8px 10px}
.dc .facts small{color:var(--muted);font-size:11px;display:block}
.dc .acts{display:flex;gap:8px;flex-wrap:wrap}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.ic .hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ic .lg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ic p{color:var(--muted);font-size:13px;margin-bottom:14px;min-height:38px}
.ic .ft2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty-note{padding:30px;text-align:center;color:var(--muted)}
.note{background:#f5a52412;border:1px solid #f5a52440;color:#ffd08a;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px}

/* modal, drawer, toast */
.ov{position:fixed;inset:0;background:#05061099;backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:18px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h3{font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:12px;color:var(--muted)}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.mact .l{margin-right:auto}
.err{color:#ff8a8a;font-size:12px;min-height:16px}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#0f1229;border-left:1px solid var(--line2);z-index:90;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px #0009}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--line)}
.drawer header .orb{width:32px;height:32px}
.drawer header small{color:var(--muted);display:block;font-size:12px}
.drawer header button{margin-left:auto;padding:6px;border-radius:8px}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-line}
.msg.bot{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--grad);align-self:flex-end;border-bottom-right-radius:4px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.sugg button{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line2);color:#c3c7e2}
.sugg button:hover{border-color:var(--violet)}
.chatin{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.chatin input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;outline:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--panel2);border:1px solid var(--line2);padding:12px 18px;border-radius:12px;z-index:100;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 10px 30px #0008}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1320px){

  .mid,.charts2{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:900px){

  .search{order:3;max-width:none;flex-basis:100%}

  .fld2{grid-template-columns:1fr}
  .dc .facts{grid-template-columns:1fr 1fr}
  .sync{justify-content:flex-start;flex-wrap:wrap}
}

// С сервером задачи, документы, решения, закупки и статьи ОПиУ общие для команды: отправляем только изменённое и удалённое.
async function pushTeam(k){
  const base = new Map((SERVER.base?.[k] || []).map(x => [x.id, JSON.stringify(x)]));
  const ids = new Set(state[k].map(x => x.id));
  const upsert = state[k].filter(x => base.get(x.id) !== JSON.stringify(x));
  const remove = [...base.keys()].filter(id => !ids.has(id));
  if(!upsert.length && !remove.length) return;
  try{
    const list = await api('POST', `/api/team/${k}/sync`, {upsert, remove});
    SERVER.base[k] = JSON.parse(JSON.stringify(list));
    state[k] = list; render();
    // Закупки и статьи ОПиУ меняют себестоимость и прибыль — пересчитываем на сервере.
    if(k==='purchases' || k==='pnl'){ await loadLive(); render(); }
  }catch(e){ toast('Не удалось сохранить на сервере: '+e.message); }
}

async function loadLive(){
  if(SNAPSHOT){ if(!SERVER.on){ applyLive(SNAPSHOT); SERVER.snapshot = true; } return true; }
  if(!HAS_API) return false;
  try{
    const r = await fetch('/api/dashboard', {cache:'no-store'});
    if(!r.ok || !(r.headers.get('content-type')||'').includes('json')) return false;
    applyLive(await r.json()); return true;
  }catch(e){ return false; }
}
function applyLive(p){
  Object.assign(DEMO, JSON.parse(JSON.stringify(DEMO0)));
  SERVER.on = true; SERVER.mode = p.mode; SERVER.integrations = p.integrations; SERVER.syncing = !!p.syncing; SERVER.real = new Set();
  state.lastSync = p.lastSync ? new Date(p.lastSync) : null;
  if(p.owner) DEMO.owner = p.owner;
  if(p.team && p.team.length) DEMO.people = p.team;
  for(const [k,v] of Object.entries(p.data || {})){
    if(k==='kpi'){ v.forEach((x,i)=>{ if(x){ DEMO.kpi[i] = {...DEMO.kpi[i], ...x}; SERVER.real.add('kpi'+i); } }); continue; }
    DEMO[k] = v; SERVER.real.add(k);
  }
  SERVER.ai = !!p.ai;
  if(p.store){
    SERVER.base = JSON.parse(JSON.stringify(p.store));
    state.tasks = p.store.tasks; state.docs = p.store.docs; state.decisions = p.store.decisions || [];
    SERVER.decMeta = p.decisionsMeta || {};
    state.purchases = p.store.purchases || []; state.pnl = p.store.pnl || []; state.costs = p.store.costs || [];
    SERVER.costsMeta = p.costsMeta || null;
  }
  SERVER.econ = p.econ || null; SERVER.tax = p.tax || null;
  if(p.econ?.unit) SERVER.real.add('econ');

}

function cashForecast(){
  const c = DEMO.cash; if(c.forecast) return c.forecast;
  let bal = c.balance; const out = [];
  for(let i=1;i<=30;i++){
    const d = day(i);
    bal += c.dailyIn - c.dailyOut - c.payments.filter(p=>p.date===d).reduce((s,p)=>s+p.amount,0);
    out.push({date:d, v:bal});
  }
  return out;
}
function cashGap(){ return DEMO.cash.forecast ? DEMO.cash.gap : cashForecast().find(p => p.v < 0) || null; }
const isOpen = t => t.status !== 'done';
const taskCounts = () => ({
  open: state.tasks.filter(isOpen).length,
  today: state.tasks.filter(t => isOpen(t) && t.due === TODAY_ISO).length,
  late: state.tasks.filter(t => isOpen(t) && t.due < TODAY_ISO).length,
  ai: state.tasks.filter(t => isOpen(t) && t.ai).length
});
function refreshDecisions(){
  let changed = false;
  state.decisions.forEach(d => {
    if(d.status==='postponed' && d.until <= TODAY_ISO){ d.status='new'; changed=true; }
    if(d.status==='doing'){
      const ts = state.tasks.filter(t => t.decision===d.id);
      if(ts.length && ts.every(t => t.status==='done')){ d.status='done'; d.decidedAt=TODAY_ISO; changed=true; }
    }
  });
  if(changed) save('decisions');
}

/* ---------- small renderers ---------- */
function spark(vals, color, w=120, h=40){
  const mn=Math.min(...vals), mx=Math.max(...vals), k=(mx-mn)||1;
  const pts = vals.map((v,i)=>[i/(vals.length-1)*w, h-4-(v-mn)/k*(h-10)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id = 'g'+uid();
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${line} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function cashChart(){
  const hist = DEMO.cash.history, fc = cashForecast();
  const all = [...hist, ...fc.map(p=>p.v)], n = all.length, todayIdx = hist.length-1;
  const W=700, H=270, L=58, R=12, T=14, B=28;
  const spread = i => 22000*Math.pow(i,0.85);
  const hiOf = (p,i) => p.hi ?? p.v+spread(i+1), loOf = (p,i) => p.lo ?? p.v-spread(i+1);
  const hi = Math.max(...all, ...fc.map(hiOf))*1.05 || 1;
  const lo = Math.min(0, ...fc.map(loOf))*1.1;
  const x = i => L + i/(n-1)*(W-L-R), y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  let g = '';
  for(let k=0;k<=4;k++){ const v = lo + (hi-lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="#5d6388" font-size="11">${short(v)}</text>`; }
  for(let i=0;i<n;i+=7){ const d = i<=todayIdx ? day(i-todayIdx) : fc[i-todayIdx-1].date; g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#5d6388" font-size="11">${dateShort(d)}</text>`; }
  if(lo<0) g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#ef444488" stroke-dasharray="3 4"/>`;
  const factPath = hist.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');
  const fcPts = [[todayIdx, hist[todayIdx]], ...fc.map((p,i)=>[todayIdx+1+i, p.v])];
  const fcPath = fcPts.map((p,i)=>(i?'L':'M')+x(p[0])+' '+y(p[1])).join(' ');
  const band = [[todayIdx, hist[todayIdx], hist[todayIdx]], ...fc.map((p,i)=>[todayIdx+1+i, hiOf(p,i), loOf(p,i)])];
  const up = band.map(b=>x(b[0])+','+y(b[1])).join(' ');
  const dn = band.slice().reverse().map(b=>x(b[0])+','+y(b[2])).join(' ');
  const gap = cashGap();
  let gapMark = '';
  if(gap){ const gi = todayIdx+1+fc.indexOf(gap); gapMark = `<line x1="${x(gi)}" x2="${x(gi)}" y1="${T}" y2="${H-B}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${x(gi)}" cy="${y(gap.v)}" r="5" fill="#ef4444" stroke="#11142a" stroke-width="2"/><text x="${x(gi)+8}" y="${y(gap.v)+18}" fill="#ff8a8a" font-size="12" font-weight="600">Кассовый разрыв · ${dateShort(gap.date)}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Прогноз денег на 30 дней"><defs><linearGradient id="cf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4f7cff" stop-opacity=".3"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></linearGradient></defs>${g}
    <polygon points="${up} ${dn}" fill="#8b5cf6" opacity=".22"/>
    <path d="${factPath} L${x(todayIdx)} ${H-B} L${x(0)} ${H-B}Z" fill="url(#cf)"/>
    <path d="${factPath}" fill="none" stroke="#4f7cff" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="${fcPath}" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="${x(todayIdx)}" x2="${x(todayIdx)}" y1="${T}" y2="${H-B}" stroke="#ffffff30"/>
    <text x="${x(todayIdx)}" y="${T+10}" text-anchor="middle" fill="#8a90b4" font-size="11" paint-order="stroke" stroke="#11142a" stroke-width="4">сегодня</text>
    ${gapMark}</svg>`;
}

// Столбики по дням месяца. series: [{key, color, label}] — несколько серий складываются в стопку.
// Подсказка по наведению — атрибут data-tip у прозрачной полосы на весь день (её проще поймать мышью).
function dayBars(rows, series, fmtV){
  const W=700, H=230, L=58, R=10, T=12, B=26, n=Math.max(rows.length,1);
  const tot = r => series.reduce((s,x)=>s+(r[x.key]||0),0);
  const hi = Math.max(1, ...rows.map(tot))*1.08, lo = Math.min(0, ...rows.map(tot));
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B), step = (W-L-R)/n, bw = Math.max(3, Math.min(18, step*0.62));
  let g = '';
  for(let k=0;k<=4;k++){ const v = lo+(hi-lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ffffff10"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" fill="#8a90b4" font-size="11">${short(v)}</text>`; }
  rows.forEach((r,i) => {
    const cx = L + step*i + step/2;
    if(i%5===0 || i===n-1) g += `<text x="${cx}" y="${H-8}" text-anchor="middle" fill="#8a90b4" font-size="11">${dateShort(r.date)}</text>`;
    let base = 0;
    series.forEach((s,si) => {
      const v = r[s.key]||0; if(!v) return;
      const top = v>0 ? base+v : base, bot = v>0 ? base : base+v;
      const y1 = y(top), y2 = y(bot) - (si && v>0 ? 2 : 0); // 2px зазор между сегментами стопки
      const isTop = series.slice(si+1).every(x=>!(r[x.key]>0));
      const h = Math.max(1, y2-y1), rad = isTop && v>0 ? Math.min(4, h/2) : 0;
      g += rad ? `<path d="M${cx-bw/2} ${y2}V${y1+rad}Q${cx-bw/2} ${y1} ${cx-bw/2+rad} ${y1}H${cx+bw/2-rad}Q${cx+bw/2} ${y1} ${cx+bw/2} ${y1+rad}V${y2}Z" fill="${s.color}"/>`
        : `<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="${s.color}"/>`;
      if(v>0) base += v;
    });
    const tip = `${dateRu(r.date)}` + series.map(s=>`<br>${series.length>1?esc(s.label)+': ':''}<b>${fmtV(r[s.key]||0)}</b>`).join('') + (series.length>1?`<br>Всего: <b>${fmtV(tot(r))}</b>`:'');
    g += `<rect class="hit" x="${L+step*i}" y="${T}" width="${step}" height="${H-T-B}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  if(lo<0) g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#ffffff40"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function dailyRows(){

}
document.addEventListener('mousemove', e => {

  const every = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : null;
  const next = every && big[0] ? new Date(new Date(big[0].date+'T00:00:00Z').getTime()+every*864e5).toISOString().slice(0,10) : null;

  const sub = t => `<div class="muted" style="font-size:11px;margin-top:2px">${t}</div>`;
  const M = T.months.find(m=>m.month===cur);
  let pm = '';

// Подсветка артикулов «Есть дешевле» в таблицах открытой страницы
function markCheap(){
  const C = cheaperList();
  if(!C.length) return;
  const by = Object.fromEntries(C.map(c=>[c.offer,c]));
  for(const td of document.querySelectorAll('#view td')){
    const el = [...td.children].find(e=>e.tagName==='B') || td;
    const c = by[el.textContent.trim()];
    if(!c || el.classList.contains('cheap-art')) continue;
    el.classList.add('cheap-art'); el.title = cheapTitle(c);
  }
}

// ---------- Модуль РНП: метрики по дням с динамикой (как в SELLTRIX) ----------
// f: rub | pct | qty; good: +1 — рост хорошо, −1 — рост плохо (расходы); kind: ord — по заказам, fin — по начислениям Ozon
const RNP_METRICS = [

  {g:'Заказы и продажи', k:'ordQty', t:'Факт. заказы, шт', f:'qty', kind:'ord', v:d=>d.ordQty},

  {g:'Заказы и продажи', k:'fboQty', t:'Заказы FBO, шт', f:'qty', kind:'ord', v:d=>d.fboQty},
  {g:'Заказы и продажи', k:'fbsQty', t:'Заказы FBS, шт', f:'qty', kind:'ord', v:d=>d.fbsQty},

  {g:'Заказы и продажи', k:'fSales', t:'Прогноз. продажи, шт', f:'qty', kind:'ord', v:d=>d.fSales},

  {g:'Заказы и продажи', k:'revenue', t:'Выручка (факт)', f:'rub', kind:'fin', v:d=>d.sales+d.returns, hint:'Продажи минус возвраты по дате начисления Ozon'},
  {g:'Расходы', k:'payout', t:'К выплате от Ozon', f:'rub', kind:'fin', v:d=>d.payout},

  {g:'Расходы', k:'cost', t:'Себестоимость', f:'rub', kind:'fin', good:-1, v:d=>d.cost},
  {g:'Расходы', k:'vat', t:'НДС', f:'rub', kind:'fin', good:-1, v:d=>d.vat},
  {g:'Расходы', k:'tax', t:'Налог', f:'rub', kind:'fin', good:-1, v:d=>d.tax}
];
const addDay = (s, n) => { const t = new Date(s+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
function rnpRange(){
  const R = state.rnpRange, t = TODAY_ISO;
  if(R==='14') return [addDay(t,-13), t];
  if(R==='30') return [addDay(t,-29), t];
  if(R==='month') return [t.slice(0,8)+'01', t];
  if(R==='prev'){ const p = addDay(t.slice(0,8)+'01', -1); return [p.slice(0,8)+'01', p]; }
  if(R==='custom' && state.rnpFrom && state.rnpTo) return state.rnpFrom <= state.rnpTo ? [state.rnpFrom, state.rnpTo] : [state.rnpTo, state.rnpFrom];
  return [addDay(t,-6), t];
}
const RNP_SUM_KEYS = ['ordQty','ordSum','fboQty','fbsQty','fboSum','fbsSum','cancelQty','cancelSum','fSales','fRevenue','fProfit','sales','returns','payout','commission','logistics','buyQty','retQty','cost','vat','tax','profit'];
const rnpSum = list => { const T = {hasOrd:false, hasFin:false}; for(const k of RNP_SUM_KEYS) T[k] = list.some(d=>d[k] === null) ? null : list.reduce((s,d)=>s+(d[k]||0),0); T.hasOrd = list.some(d=>d.hasOrd); T.hasFin = list.some(d=>d.hasFin); return T; };
function rnpFmt(f, v){ if(v===null || v===undefined || !Number.isFinite(v)) return '—'; return f==='rub' ? rub(v) : f==='pct' ? String(Math.round(v*100)/100).replace('.',',')+' %' : fmt(v); }
function rnpDelta(m, v, p){
  if(v===null || p===null || v===undefined || p===undefined || !Number.isFinite(v) || !Number.isFinite(p)) return '';
  const d = v - p; if(Math.abs(d) < (m.f==='pct'?0.05:0.5)) return '';
  const good = d * (m.good || 1) > 0, a = Math.abs(d);
  const txt = m.f==='rub' ? (a>=1000 ? (a/1000).toFixed(1)+'к' : String(Math.round(a))) : m.f==='pct' ? a.toFixed(1) : (Number.isInteger(Math.round(a*10)/10) ? String(Math.round(a)) : a.toFixed(1));
  return ` <small class="dl ${good?'up':'down'}">${d>0?'▲':'▼'} ${txt}</small>`;
}
function rnpSpark(m, vals){
  const nums = vals.map(v => Number.isFinite(v) ? v : null), mx = Math.max(1e-9, ...nums.map(v=>Math.abs(v||0)));
  const n = nums.length, w = Math.max(40, n*7), h = 26, bw = Math.max(3, Math.min(6, w/n - 2));
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${nums.map((v,i)=>{ if(v===null) return ''; const bh = Math.max(2, Math.abs(v)/mx*(h-2)), prev = i ? nums[i-1] : null;
    const col = prev===null ? '#5d6388' : (v-prev)*(m.good||1) >= 0 ? '#22c55e' : '#ef4444';
    return `<rect x="${i*(w/n)+(w/n-bw)/2}" y="${h-bh}" width="${bw}" height="${bh}" rx="1.5" fill="${col}"/>`; }).join('')}</svg>`;
}
function viewAnalytics(){
  const R = E().rnp;
  if(!econReal() || !R) return usesShopData() ? shopDataStatus() : viewAnalyticsDemo();
  const [from, to] = rnpRange(), dates = [];
  for(let d = from; d <= to; d = addDay(d,1)) dates.push(d);
  const byDate = Object.fromEntries(R.days.map(d=>[d.date, d]));
  const empty = date => ({date, hasOrd:false, hasFin:false});
  const cols = dates.map(d => byDate[d] || empty(d));
  const official = d => R.ordered?.from <= d && d <= R.ordered?.to ? R.ordered.days[d] || 0 : null;
  // Заказы известны с первой даты выгрузки отправлений (60 дней), факт — в дни, за которые есть начисления Ozon
  const known = (m, d) => m.kind==='ord' ? (d.date ? !!R.ordersFrom && d.date >= R.ordersFrom : d.hasOrd) : d.hasFin;
  const val = (m, d) => known(m, d) ? m.v(d) : null;
  const metrics = RNP_METRICS.filter(m => !state.rnpHidden.includes(m.k));
  const offersActive = Object.values(R.offers).filter(o => dates.some(d => o.days[d]?.ordQty)).length;
  const rangeSel = `<select data-rnprange>${[['7','7 дней'],['14','14 дней'],['30','30 дней'],['month','Текущий месяц'],['prev','Прошлый месяц'],['custom','Свой период']].map(([k,t])=>`<option value="${k}" ${state.rnpRange===k?'selected':''}>${t}</option>`).join('')}</select>`;
  const custom = state.rnpRange==='custom' ? `<input type="date" data-rnpfrom value="${from}"> — <input type="date" data-rnpto value="${to}">` : '';
  const head = `<div class="ph"><h2>Модуль РНП</h2><span class="chip2">${fmt(offersActive)} ${plural(offersActive,'артикул','артикула','артикулов')} с заказами</span><span class="chip2">${dateRu(from,{day:'numeric',month:'short'})} – ${dateRu(to,{day:'numeric',month:'short'})}</span><span class="sp"></span>
    <details class="rows-set"><summary class="btn sm">${ic('filter')}Настройка строк <span class="badge">${metrics.length}</span></summary><div class="rows-pop">${RNP_METRICS.map(m=>`<label class="chk"><input type="checkbox" data-rnpmetric="${m.k}" ${state.rnpHidden.includes(m.k)?'':'checked'}> ${m.t}</label>`).join('')}</div></details></div>
    <div class="filters">${rangeSel}${custom}${state.rnpTab==='sku' ? `<input type="text" data-rnpq placeholder="Артикул или название" value="${esc(state.rnpQ)}"><select data-rnpmet>${RNP_METRICS.map(m=>`<option value="${m.k}" ${state.rnpMet===m.k?'selected':''}>${m.t}</option>`).join('')}</select>` : ''}</div>
    <div class="tabs"><button class="${state.rnpTab!=='sku'?'on':''}" data-rnptab="sum">Сводная таблица</button><button class="${state.rnpTab==='sku'?'on':''}" data-rnptab="sku">По артикулам <span class="badge">${offersActive}</span></button></div>`;
  const dayHead = dates.map(d=>`<th class="r">${dateRu(d,{day:'numeric',month:'short'})}</th>`).join('');
  const note = `<div class="note" style="margin-top:10px">Общее количество заказанных товаров — по аналитике Ozon. Разбивка FBO и FBS, суммы заказов и данные по артикулам — по отправлениям без отмен. Выкупы, возвраты, выручка и расходы — по дате начисления. Прибыль за день отображается после заполнения себестоимости.</div>`;
  if(state.rnpTab==='sku'){
    const m = RNP_METRICS.find(x=>x.k===state.rnpMet) || RNP_METRICS[1], q = state.rnpQ.toLowerCase();
    let rows = Object.entries(R.offers).map(([offer, o]) => {
      const list = dates.map(d => o.days[d] ? {...o.days[d], date:d} : empty(d)), T = rnpSum(list);
      return {offer, name:o.name, list, T, total: val(m, {...T, date:null})};
    }).filter(r => r.T.hasOrd || r.T.hasFin).filter(r => !q || (r.offer+' '+r.name).toLowerCase().includes(q));
    rows.sort((a,b)=>(b.total??-1e12)-(a.total??-1e12));
    const tr = r => `<tr><td class="stick" title="${esc(r.name)}"><b>${esc(r.offer)}</b></td><td class="r num tot2"><b>${rnpFmt(m.f, r.total)}</b></td><td>${rnpSpark(m, r.list.map(d=>val(m,d)))}</td>${r.list.map(d=>`<td class="r num">${rnpFmt(m.f, val(m,d))}</td>`).join('')}</tr>`;
    return `${head}<div class="tbl-wrap fix"><table class="ozon rnp"><thead><tr><th class="stick">Артикул</th><th class="r tot2">Итого</th><th>Динамика</th>${dayHead}</tr></thead><tbody>${rows.map(tr).join('') || `<tr><td colspan="${dates.length+3}" class="empty-note">Нет данных за период</td></tr>`}</tbody></table></div>${note}`;
  }
  const T = {...rnpSum(cols), date:null};
  let g = '', body = '';
  for(const m of metrics){
    if(m.g !== g){ g = m.g; const n = metrics.filter(x=>x.g===g).length, closed = state.rnpClosed.includes(g);
      body += `<tr class="grp-row" data-rnpgrp="${esc(g)}"><td class="stick" colspan="1"><span class="caret">${closed?'›':'⌄'}</span> ${esc(g.toUpperCase())} <span class="badge">${n}</span></td><td colspan="${dates.length+2}"></td></tr>`; }
    if(state.rnpClosed.includes(g)) continue;
    const ordered = m.k === 'ordQty';
    const vals = cols.map(d => ordered ? official(d.date) : val(m, d));
    const total = ordered ? (vals.every(v=>v !== null) ? vals.reduce((a,b)=>a+b,0) : null) : val(m, T);
    body += `<tr><td class="stick" ${m.hint?`title="${esc(m.hint)}"`:''}>${ordered ? 'Заказано товаров, шт · аналитика Ozon' : m.t}</td><td class="r num tot2"><b>${rnpFmt(m.f, total)}</b></td><td>${rnpSpark(m, vals)}</td>${vals.map((v,i)=>`<td class="r num">${rnpFmt(m.f, v)}${i ? rnpDelta(m, v, vals[i-1]) : ''}</td>`).join('')}</tr>`;
  }
  return `${head}<div class="tbl-wrap fix"><table class="ozon rnp"><thead><tr><th class="stick">Метрика</th><th class="r tot2">Итого</th><th>Динамика</th>${dayHead}</tr></thead><tbody>${body}</tbody></table></div>${note}`;
}

/* ---------- экономика: карточки Главной, юнит-экономика, ОПиУ, склад, закупки, цена товара ---------- */
const p1 = v => nz(v, x => String(Math.round(x*10)/10).replace('.',',')+'%');
const monthName = m => { const s = new Date(m+'-01T00:00').toLocaleDateString('ru-RU',{month:'long', year:'numeric'}).replace(' г.',''); return s[0].toUpperCase()+s.slice(1); };
const PRICING_DEF = {targetMarginPct:20, drrPct:0, acquiringPct:1, extraPct:5, scheme:'FBO', logisticsMode:'tariff', commissionPct:20, logistics:120, returnCost:60, returnRatePct:35, vatPct:5, packaging:{}, packDefault:5, ozonPack:15};
const pricingParams = () => SERVER.on ? {...PRICING_DEF, ...(SERVER.econ?.pricingParams || {})} : {...PRICING_DEF, ...store.get('pricing', {})};
const econReal = () => isReal('econ');
const E = () => usesShopData() ? SERVER.econ || {} : demoEcon();

// Ссылка на товар у поставщика: только http(s), открывается в новой вкладке.
const safeUrl = u => /^https?:\/\/[^\s"'<>]+$/i.test(String(u||'').trim()) ? String(u).trim() : '';
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } };
const supLink = (name, url) => { const u = safeUrl(url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${esc(name || hostOf(u))} ↗</a>` : esc(name || '—'); };

// Себестоимость по закупкам: средняя взвешенная, доп. расходы делятся на штуки (как на сервере).
function costSummary(){
  const by = {};
  for(const p of [...state.purchases].sort((a,b)=>(a.date||'').localeCompare(b.date||''))){
    const offer = String(p.offer||'').trim(), qty = Number(p.qty)||0; if(!offer || qty<=0) continue;
    const b = by[offer] = by[offer] || {offer, name:p.name||'', qty:0, total:0, suppliers:new Map(), last:null, inTransit:0};
    b.qty += qty; b.total += qty*(Number(p.price)||0) + (Number(p.extra)||0);
    const sName = p.supplier || hostOf(safeUrl(p.url));
    if(sName) b.suppliers.set(sName, safeUrl(p.url) || b.suppliers.get(sName) || '');
    if(!b.last || (p.date||'') >= (b.last.date||'')) b.last = {date:p.date, price:Number(p.price)||0};
    if(p.status!=='Получено') b.inTransit += qty;
    if(!b.name && p.name) b.name = p.name;
  }
  const list = Object.values(by).map(b => ({...b, unitCost: b.total/b.qty, src:'закупки', suppliers:[...b.suppliers].map(([name, url])=>({name, url}))}));
  // Себестоимость из загруженного файла — главнее закупок (как и в расчётах на сервере).
  for(const c of state.costs || []){
    const b = list.find(x=>x.offer===c.offer);
    if(b){ b.unitCost = c.unitCost; b.src = 'файл'; if(!b.name) b.name = c.name; }
    else list.push({offer:c.offer, name:c.name, qty:0, total:0, unitCost:c.unitCost, src:'файл', suppliers:[], last:null, inTransit:0});
  }
  return list.sort((a,b)=>b.total-a.total || String(a.offer).localeCompare(String(b.offer)));
}

// Демо-экономика (Ozon не подключён): примерные товары, формулы те же, что на сервере.
function demoEcon(){
  const cur = TODAY_ISO.slice(0,7), pd = new Date(TODAY); pd.setDate(0); const prev = iso(pd).slice(0,7);
  const dom = TODAY.getDate(), dim = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0).getDate();
  const items = [
    {offer:'1024', name:'Худи oversize чёрное', price:1800, cost:808, perDay:12, ret:8, comm:19, fbo:58, fbs:14},
    {offer:'1031', name:'Худи oversize серое', price:1800, cost:808, perDay:9, ret:8, comm:19, fbo:330, fbs:80},
    {offer:'3305', name:'Футболка хлопок белая', price:700, cost:255, perDay:14, ret:5, comm:17, fbo:990, fbs:250},
    {offer:'3306', name:'Футболка хлопок чёрная', price:700, cost:255, perDay:15, ret:5, comm:17, fbo:170, fbs:40},
    {offer:'2210', name:'Свитшот базовый', price:1400, cost:610, perDay:9, ret:10, comm:19, fbo:420, fbs:100},
    {offer:'2214', name:'Свитшот с принтом', price:1700, cost:1150, perDay:4, ret:18, comm:19, fbo:550, fbs:140}
  ];
  const unit = {}, pnl = {};
  for(const [m, days] of [[cur, dom], [prev, pd.getDate()]]){
    unit[m] = items.map(it => {
      const buyQty = Math.round(it.perDay*days), retQty = Math.round(buyQty*it.ret/100), ordQty = Math.round(buyQty*1.08);
      const buyRev = buyQty*it.price, retRev = retQty*it.price, net = buyRev-retRev;
      const commission = -Math.round(net*it.comm/100), logistics = -(buyQty*95 + retQty*55), acquiring = -Math.round(buyRev*0.015);
      const payout = net + commission + logistics + acquiring, cost = (buyQty-retQty)*it.cost, ads = Math.round(net*0.06), tax = Math.round(net*0.06);
      const profit = payout - cost - ads - tax;
      return {offer:it.offer, name:it.name, ordQty, ordSum:ordQty*it.price, buyQty, buyRev, retQty, retRev, retPct:Math.round(retQty/(buyQty+retQty)*1000)/10,
        commission, logistics, acquiring, ads, tax, cost, costKnown:true, payout, profit, margin:Math.round(profit/net*1000)/10, perUnit:Math.round(profit/(buyQty-retQty)),
        fbo:it.fbo, fbs:it.fbs, ordFbo:Math.round(ordQty*0.75)};
    });
    const U = unit[m], s = f => U.reduce((a,u)=>a+f(u),0);
    const sales = s(u=>u.buyRev), returns = -s(u=>u.retRev), netMp = sales+returns, storage = -Math.round(6500*days/7), ads = -s(u=>u.ads);
    const payout = s(u=>u.payout) + storage + ads, cost = s(u=>u.cost), tax = Math.round(netMp*0.06);
    const lines = state.pnl.filter(l=>l.month===m);
    const income = lines.filter(l=>l.type==='income').reduce((a,l)=>a+Number(l.amount),0);
    let expenses = lines.filter(l=>l.type!=='income').reduce((a,l)=>a+Number(l.amount),0), fixedFromSettings = 0;
    if(!lines.some(l=>l.type!=='income')){ fixedFromSettings = Math.round(450000*(m===cur ? dom/dim : 1)); expenses = fixedFromSettings; }
    const net = payout - cost + income - expenses - tax;
    pnl[m] = {month:m, sales, returns, netMp, commission:s(u=>u.commission), logistics:-s(u=>u.buyQty)*95, returnLogistics:-s(u=>u.retQty)*55, acquiring:s(u=>u.acquiring),
      storage, ads, adsSource:'ozon', services:0, compensation:0, payout, cost, costByPct:0, income, expenses, fixedFromSettings, lines,
      tax, taxMode:'usn_income', taxRate:6, revenue:netMp, net, margin:Math.round(net/(netMp+income)*1000)/10};
  }
  const transit = Object.fromEntries(costSummary().map(c=>[c.offer, c.inTransit]));
  const rows = items.map(it => {
    const total = it.fbo+it.fbs, daily = it.perDay*1.1, days = Math.floor(total/daily), inTransit = transit[it.offer]||0;
    const status = days < 14 ? 'Срочно дозаказать' : days < 28 ? 'Скоро закончится' : days > 90 ? 'Залежался' : 'В норме';
    return {offer:it.offer, name:it.name, fbo:it.fbo, fbs:it.fbs, total, inTransit, sold28:Math.round(daily*28), daily:Math.round(daily*10)/10, days, until:day(days),
      reorder:Math.max(0, Math.ceil((daily*45-total-inTransit)/10)*10), status, value:total*it.cost};
  }).sort((a,b)=>a.days-b.days);
  const sumR = f => rows.reduce((a,r)=>a+f(r),0);
  const P = pricingParams();
  const pricing = items.map(it => {
    const input = {cost:it.cost, commissionPct:it.comm, logistics:95, returnCost:55, returnRatePct:it.ret, acquiringPct:P.acquiringPct, drrPct:P.drrPct, targetMarginPct:P.targetMarginPct, vatPct:P.vatPct, taxMode:'usn_income', taxPct:6, currentPrice:it.price};
    return {offer:it.offer, name:it.name, input, src:{commission:'ozon', logistics:'fact', returnRate:'fact'}, costKnown:true, ...Pricing.calcPrice(input)};
  }).sort((a,b)=>Number(b.belowMin)-Number(a.belowMin));
  const U = unit[cur], s = f => U.reduce((a,u)=>a+f(u),0), bq = s(u=>u.buyQty), rq = s(u=>u.retQty), oq = s(u=>u.ordQty), os = s(u=>u.ordSum), fq = s(u=>u.ordFbo);
  return {
    months:[cur, prev], unit, pnl, pricing, pricingParams:P,
    stock:{rows, summary:{fbo:sumR(r=>r.fbo), fbs:sumR(r=>r.fbs), inTransit:sumR(r=>r.inTransit), value:sumR(r=>r.value), valueKnown:true,
      turnover:Math.round(sumR(r=>r.total)/sumR(r=>r.daily)), urgent:rows.filter(r=>r.status==='Срочно дозаказать').length, stale:rows.filter(r=>r.status==='Залежался').length}},
    tiles:{orders:{sum:os, qty:oq}, fbo:{qty:fq, sum:Math.round(os*fq/oq)}, fbs:{qty:oq-fq, sum:os-Math.round(os*fq/oq)},
      buyouts:{sum:s(u=>u.buyRev), qty:bq, pct:Math.round(bq/(bq+rq)*1000)/10}, returns:{sum:s(u=>u.retRev), qty:rq, pct:Math.round(rq/(bq+rq)*1000)/10},
      profit:{net:pnl[cur].net, margin:pnl[cur].margin}, stock:{fbo:sumR(r=>r.fbo), fbs:sumR(r=>r.fbs)}}
  };
}

// Плитка «Жалобы и отзывы»: доля жалоб из рейтинга Ozon и отзывы на 1–3 звезды без ответа. Есть актуальные — красная.
function complaintsTile(){

  ].filter(Boolean);

    <div class="tsub">${parts.join('<br>')}</div>

}

  {g:'Прибыль', t:'Прибыль за период', v:u=>u.profit, cls:v=>v<0?'down':'up', bold:true},

// Сумма по колонке Ozon у строки; для старых данных без разбивки — логистика и эквайринг целиком.
const uc = (u, k) => u.cols ? (u.cols[k] || 0) : ({logistics:u.logistics, acquiring:u.acquiring}[k] || 0);

function viewUnit(){
  const e = E(), months = e.months || [];
  if(!months.length) return `<div class="ph"><h2>Юнит-экономика</h2></div><div class="card empty-note">Подключите Ozon, чтобы увидеть экономику по артикулам.</div>`;
  const periods = [...months.filter(m => e.unit?.[m]), ...(e.unit?.all ? ['all'] : [])];
  if(!periods.includes(state.unitPeriod)) state.unitPeriod = periods[0];
  const m = state.unitPeriod, q = state.unitQ.toLowerCase();
  const periodName = x => x==='all' ? `Все месяцы${e.unitAllRange ? ` (${dateRu(e.unitAllRange.from,{day:'numeric',month:'short'})} – ${dateRu(e.unitAllRange.to,{day:'numeric',month:'short'})})` : ''}` : monthName(x);
  const all = e.unit?.[m] || [];
  let rows = all.filter(u => !q || (u.offer+' '+u.name).toLowerCase().includes(q));
  if(state.unitLoss) rows = rows.filter(u => u.profit < 0);
  if(state.unitActive) rows = rows.filter(u => u.buyQty || u.retQty || u.ordQty);
  const s = f => rows.reduce((a,u)=>a+(Number(f(u))||0),0);
  const tot = {buyQty:s(u=>u.buyQty), retQty:s(u=>u.retQty), buyRev:s(u=>u.buyRev), retRev:s(u=>u.retRev), profit:rows.some(u=>u.profit === null) ? null : s(u=>u.profit)};
  const net = tot.buyRev - tot.retRev, losses = all.filter(u=>u.profit<0);
  // Пустые колонки (ноль у всех строк) можно скрыть, чтобы таблица была уже
  const cols = UNIT_COLUMNS.filter(c => !state.unitHideEmpty || c.noTotal || c.own || rows.some(u => Number(c.v(u))));
  const groups = []; cols.forEach(c => { const l = groups[groups.length-1]; if(l && l.g===c.g) l.n++; else groups.push({g:c.g, n:1}); });
  const cell = (c, v, approx) => { const f = c.f || rub; const cls = c.cls ? c.cls(v) : (typeof v==='number' && v<0 && !c.f ? 'down' : ''); const txt = v===null || v===undefined || v==='' ? '—' : f(v); return `<td class="r num ${cls}">${approx?'≈ ':''}${c.bold?`<b>${txt}</b>`:txt}</td>`; };
  const tr = u => `<tr class="${u.profit<0 ? 'loss' : ''}"><td class="stick" title="${esc(u.name)}"><b>${esc(u.offer)}</b><br><small class="muted">${esc(u.name)}</small></td>${cols.map(c => c.t === 'Себестоимость, шт' && !u.costKnown ? '<td class="r">'+costButton(u.offer)+'</td>' : cell(c, c.v(u), c.approx && !u.costKnown)).join('')}</tr>`;
  const totRow = `<tr class="tot"><td class="stick"><b>Итого</b></td>${cols.map(c => c.noTotal ? '<td></td>' : cell(c, c.own ? c.own(tot) : c.t === 'Прибыль за период' ? tot.profit : rows.some(u=>c.v(u) === null) ? null : s(c.v))).join('')}</tr>`;
  const reps = e.unitReports || [], repMonths = new Set(e.reportMonths || []);
  const repNote = reps.length ? `<details class="note" style="margin-bottom:12px"><summary style="cursor:pointer">Загружено отчётов Ozon «Юнит-экономика»: ${reps.length}. Из них в расчётах — ${repMonths.size} ${plural(repMonths.size,'месяц','месяца','месяцев')} (где нет данных API)</summary>
    <div style="margin-top:8px;display:grid;gap:4px">${reps.map(r=>`<div>${monthName(r.month)} — ${esc(r.file)} · ${fmt(r.rows)} артикулов · ${repMonths.has(r.month) ? '<b class="up">используется</b>' : 'месяц есть в API Ozon — используется API'}${r.full?'':' · неполный месяц'}</div>`).join('')}</div></details>` : '';
  return `<div class="ph"><h2>Юнит-экономика</h2>${etag()}<span class="sp"></span>${SERVER.on && !SERVER.snapshot ? `<button class="btn" data-act="unitRepUpload" title="Выгрузка из кабинета Ozon: Аналитика → Юнит-экономика, по месяцу в файле">${ic('download')}Загрузить отчёты Ozon</button>` : ''}<select data-unitperiod>${periods.map(x=>`<option value="${x}" ${x===m?'selected':''}>${periodName(x)}</option>`).join('')}</select></div>
  ${repNote}
  <div class="stats">
    <div class="stat"><small>Доставлено</small><b class="num">${fmt(tot.buyQty)} шт · ${rub(tot.buyRev)}</b></div>
    <div class="stat"><small>Возвращено</small><b class="num">${fmt(tot.retQty)} шт · ${p1(tot.buyQty+tot.retQty ? tot.retQty/(tot.buyQty+tot.retQty)*100 : null)}</b></div>
    <div class="stat"><small>Прибыль за период</small><b class="num ${tot.profit<0?'down':'up'}">${rub(tot.profit)}</b></div>
    <div class="stat"><small>Маржа</small><b>${p1(net && tot.profit !== null ? tot.profit/net*100 : null)}</b></div>
    <button class="stat ${state.unitLoss?'on':''}" data-act="unitLoss"><small>Убыточных артикулов</small><b class="${losses.length?'down':''}">${losses.length}</b></button>
  </div>
  <div class="filters"><input type="text" data-unitq placeholder="Артикул или название" value="${esc(state.unitQ)}">
    <label class="chk"><input type="checkbox" data-unitflag="unitActive" ${state.unitActive?'checked':''}> Только с продажами</label>
    <label class="chk"><input type="checkbox" data-unitflag="unitHideEmpty" ${state.unitHideEmpty?'checked':''}> Скрыть пустые колонки</label></div>
  <div class="note">Колонки — как в отчёте Ozon «Юнит-экономика»: выручка от покупателя, баллы и программы партнёров вместе дают вашу цену продажи; ниже — удержания Ozon по типам (колонок продвижения нет: рекламы у вас нет; если появится, её расходы всё равно войдут в «К выплате»). Доставлено и возвращено — по дате начисления Ozon. Прибыль = к выплате от Ozon − себестоимость − налог. Где себестоимости нет, стоит «≈» и % из настроек. Красным — артикулы в убытке.</div>
  <div class="tbl-wrap fix"><table class="unit ozon"><thead>
    <tr><th class="stick" rowspan="2">Артикул и название</th>${groups.map(g=>`<th class="grp" colspan="${g.n}">${g.g}</th>`).join('')}</tr>
    <tr>${cols.map(c=>`<th class="r" ${c.hint?`title="${esc(c.hint)}"`:''}>${c.t}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(tr).join('') || `<tr><td colspan="${cols.length+1}" class="empty-note">Нет данных за период</td></tr>`}${rows.length>1?totRow:''}
  </tbody></table></div>`;
}

// Налоги по месяцам: продажи на Ozon → НДС (внутри выручки) → доход без НДС → УСН; итоги кварталов и сроки оплаты.
function viewTaxes(){
  const e = E(), tax = SERVER.tax || {mode:'usn_income', rate:6, vat:5};
  const allMonths = [...(e.months || [])].filter(m => e.pnl?.[m]).sort();
  if(!allMonths.length) return `<div class="ph"><h2>Налоги</h2></div><div class="card empty-note">Подключите Ozon или загрузите отчёты, чтобы посчитать налоги.</div>`;
  // Год — переключателем; годы — с первого месяца, по которому есть данные (API Ozon или загруженные отчёты)
  const years = [...new Set(allMonths.map(m => m.slice(0,4)))];
  if(!years.includes(state.taxYear)) state.taxYear = years.includes(TODAY_ISO.slice(0,4)) ? TODAY_ISO.slice(0,4) : years[years.length-1];
  const Y = state.taxYear, months = allMonths.filter(m => m.slice(0,4) === Y);
  const vr = Number(tax.vat || 0), tr = Number(tax.rate ?? 6);
  // Компенсации и декомпенсации Ozon входят в доход УСН «доходы» (НДС с них нет)
  const row = m => { const P = e.pnl[m], gross = (P.revenue||0) + (P.income||0), comp = P.taxMode==='usn_income' || !P.taxMode ? P.compensation||0 : 0; return {m, gross, sales:P.revenue||0, income:P.income||0, payout:P.payout||0, vat:P.vat||0, comp, base:gross-(P.vat||0)+comp, usn:P.tax||0, src:P.source}; };
  const rows = months.map(row);
  const hasIncome = rows.some(r => r.income), hasComp = rows.some(r => r.comp);
  const qOf = m => `${Math.ceil(Number(m.slice(5,7))/3)} кв. ${m.slice(0,4)}`;
  const sumOf = list => list.reduce((a,r)=>({gross:a.gross+r.gross, sales:a.sales+r.sales, income:a.income+r.income, payout:a.payout+r.payout, vat:a.vat+r.vat, comp:a.comp+r.comp, base:a.base+r.base, usn:a.usn+r.usn}), {gross:0,sales:0,income:0,payout:0,vat:0,comp:0,base:0,usn:0});
  const cur = TODAY_ISO.slice(0,7), curQ = qOf(cur);
  // Суммы НДС и УСН — кнопки: по нажатию открывается расшифровка (формула и отчёты Ozon). key — месяцы через запятую.
  const link = (v, key, kind) => e.taxDocs && key ? `<span class="taxlink" data-taxinfo="${key}|${kind}" title="Как посчитано и из каких отчётов">${rub(v)}</span>` : rub(v);
  const line = (t, r, cls='', key='') => `<tr class="${cls}"><td>${t}</td><td class="r num">${rub(r.sales)}</td><td class="r num">${rub(r.payout)}</td>${hasIncome?`<td class="r num">${rub(r.income)}</td>`:''}<td class="r num">${link(r.vat, key, 'vat')}</td>${hasComp?`<td class="r num">${r.comp?rub(r.comp):'—'}</td>`:''}<td class="r num">${rub(r.base)}</td><td class="r num">${link(r.usn, key, 'usn')}</td><td class="r num"><b>${rub(r.vat+r.usn)}</b></td></tr>`;
  let body = '', q = null, qRows = [];
  const flushQ = () => { if(q && qRows.length){ body += line(`<b>Итого ${q}</b>${q===curQ ? ' <small class="muted">квартал не закончился</small>' : ''}`, sumOf(qRows), 'tot', qRows.map(r=>r.m).join(',')); } qRows = []; };
  for(const r of rows){
    if(qOf(r.m) !== q){ flushQ(); q = qOf(r.m); }
    qRows.push(r);
    body += line(`${monthName(r.m)}${r.m===cur ? ' <small class="muted">по сегодня</small>' : ''}${r.src==='report' ? ' <small class="muted">по отчёту Ozon</small>' : ''}`, r, '', r.m);
  }
  flushQ();
  const year = sumOf(rows);
  // Сроки: УСН — до 28-го числа месяца после квартала (за 4 кв. — до 28 апреля), НДС — тремя частями до 28-го числа трёх следующих месяцев
  const pad = n => String(n).padStart(2,'0');
  const due = (y, mo) => { const t = new Date(Date.UTC(y, mo-1, 28)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-28`; };
  const quarters = [...new Set(rows.map(r => r.m.slice(0,4)+'-'+Math.ceil(Number(r.m.slice(5,7))/3)))];
  const pays = [];
  for(const k of quarters){
    const [y, qn] = k.split('-').map(Number), list = rows.filter(r => Number(r.m.slice(0,4))===y && Math.ceil(Number(r.m.slice(5,7))/3)===qn), s = sumOf(list);
    const name = `${qn} кв. ${y}`, open = `${y}-${pad(qn*3)}` >= cur;
    if(s.usn) pays.push({date: qn===4 ? `${y+1}-04-28` : due(y, qn*3+1), title:`УСН ${tr}% за ${name}`, amount:s.usn, open});
    if(s.vat) for(let i=1;i<=3;i++) pays.push({date: due(y, qn*3+i), title:`НДС ${vr}% за ${name} (${i}/3)`, amount:s.vat/3, open});
  }
  pays.sort((a,b)=>a.date.localeCompare(b.date));
  const next = pays.filter(p => p.date >= TODAY_ISO);
  const payRow = p => `<tr class="${p.date < TODAY_ISO ? 'muted' : ''}"><td>${dateRu(p.date,{day:'numeric',month:'long',year:'numeric'})}</td><td>${esc(p.title)}${p.open?' <small class="muted">оценка — квартал не закончился</small>':''}</td><td class="r num"><b>${rub(p.amount)}</b></td><td>${p.date < TODAY_ISO ? '<span class="tag">срок прошёл</span>' : (new Date(p.date+'T00:00')-TODAY)/864e5 <= 7 ? '<span class="tag high">скоро</span>' : '<span class="tag low">предстоит</span>'}</td></tr>`;
  const H = e.history;
  const histNote = H && H.left > 0 ? `<div class="note" style="background:#4f7cff12;border-color:#4f7cff40;color:#b9c8ff">Загружаю историю магазина из Ozon: сейчас есть данные с ${monthName(H.loadedFrom)}, магазин работает с ${monthName(H.start)}. Осталось примерно ${H.left} ${plural(H.left,'месяц','месяца','месяцев')} — догружается по 6 месяцев при каждой синхронизации (раз в 30 минут). Новые годы появятся здесь сами.</div>` : '';
  const staleNote = H && H.stale > 0 ? `<div class="note" style="background:#f5a52412;border-color:#f5a52440">Уточняю данные прошлых месяцев из начислений Ozon (продажи и компенсации для расшифровки налогов). Осталось пересчитать ${H.stale} ${plural(H.stale,'месяц','месяца','месяцев')} — по 6 при каждой синхронизации (раз в 30 минут). Пока в них старые суммы.</div>` : '';
  return `<div class="ph"><h2>Налоги</h2>${etag()}</div>${histNote}${staleNote}
  <div class="tabs">${years.map(y => `<button class="${y===Y?'on':''}" data-taxyear="${y}">${y} год</button>`).join('')}</div>
  <div class="stats">
    <div class="stat"><small>Продажи на Ozon за ${Y}</small><b class="num">${rub(year.gross)}</b></div>
    <div class="stat"><small>Перечислено Ozon за ${Y}</small><b class="num">${rub(year.payout)}</b></div>
    <div class="stat"><small>НДС ${vr}% за ${Y}</small><b class="num">${rub(year.vat)}</b></div>
    <div class="stat"><small>УСН ${tr}% за ${Y}</small><b class="num">${rub(year.usn)}</b></div>
    <div class="stat"><small>Ближайший платёж</small><b class="num">${next[0] ? rub(next.filter(p=>p.date===next[0].date).reduce((s,p)=>s+p.amount,0))+' · до '+dateRu(next[0].date) : '—'}</b></div>
  </div>

  <div class="tbl-wrap fix"><table><thead><tr><th>Месяц</th><th class="r">Продажи на Ozon</th><th class="r">Перечислено Ozon</th>${hasIncome?'<th class="r">Прочие доходы</th>':''}<th class="r">НДС ${vr}% к уплате</th>${hasComp?'<th class="r" title="Компенсации Ozon за утерянный или повреждённый товар минус декомпенсации. Входят в доход УСН, НДС с них нет">Компенсации Ozon</th>':''}<th class="r">Доход для УСН</th><th class="r">УСН ${tr}% к уплате</th><th class="r">Всего налогов</th></tr></thead><tbody>
    ${body}${line(`<b>Итого за ${Y} год</b>`, year, 'tot', months.join(','))}
  </tbody></table></div>
  <h3 style="margin:22px 0 12px;font-size:16px">Когда платить</h3>
  <div class="tbl-wrap mini"><table><thead><tr><th>Срок</th><th>Платёж</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>${pays.map(payRow).join('')}</tbody></table></div>
  <p class="muted" style="font-size:12px;margin-top:8px">УСН платится авансом до 28-го числа месяца после квартала (за 4 квартал — до 28 апреля следующего года). НДС за квартал делится на три равные части и платится до 28-го числа каждого из трёх следующих месяцев. Ставки — в settings.json (taxRate, vatRate).</p>`;
}

// Расшифровка НДС / УСН за месяц, квартал или год: формула по шагам, источник каждой суммы и сверка с отчётом о реализации Ozon.
const TAX_SRC = {
  acc: 'Начисления Ozon (кабинет: «Финансы → Начисления»)',
  mb: 'Отчёт о выкупе товаров Ozon (кабинет: «Финансы → Документы»)',
  real: 'Отчёт о реализации товаров (кабинет: «Финансы → Документы»)',
  report: 'Загруженный отчёт Ozon «Юнит-экономика»',
  own: 'Ваши строки в разделе «Прибыли и убытки»',
  comp: 'Отчёт о компенсациях Ozon (кабинет: «Финансы → Документы»); в начислениях — «Компенсация за товар»',
  decomp: 'Отчёт о декомпенсациях Ozon (кабинет: «Финансы → Документы»); в начислениях — «Компенсация за товар» со знаком минус'
};
function taxCalc(months){
  const D = E().taxDocs || {}, list = months.map(m => [m, D[m]]).filter(x => x[1]);
  const s = k => list.reduce((a,[,d]) => a + (d[k]||0), 0);
  const d0 = list[0]?.[1] || {}, vr = d0.vatRate || 0, tr = d0.taxRate ?? 6;
  const fromReport = list.filter(([,d]) => d.source==='report').map(([m])=>m);
  const lines = [
    {t:`Продажи по начислениям Ozon <small class="muted">${fmt(s('buyQty'))} шт, по вашей цене продажи</small>`, v:s('sales'), src: fromReport.length===list.length ? 'report' : 'acc'},
    ...(s('mb') ? [{t:`Выкупы Ozon для других стран <small class="muted">${fmt(s('mbQty'))} шт</small>`, v:s('mb'), src:'mb'}] : []),
    {t:`Возвраты <small class="muted">${fmt(s('retQty'))} шт</small>`, v:s('returns'), src: fromReport.length===list.length ? 'report' : 'acc'},
    ...(s('income') ? [{t:'Прочие доходы', v:s('income'), src:'own'}] : [])
  ];
  // в УСН «доходы» — компенсации Ozon (+) и декомпенсации (−); при другом режиме налога они в базу не идут
  const usnComp = s('usnComp'), comp = usnComp ? [
    ...(s('compIn') ? [{t:`Компенсации от Ozon <small class="muted">${s('compN') ? fmt(s('compN'))+' '+plural(s('compN'),'начисление','начисления','начислений')+', ' : ''}за утерянный или повреждённый товар</small>`, v:s('compIn'), src:'comp'}] : []),
    ...(s('compOut') ? [{t:`Декомпенсации <small class="muted">${s('decompN') ? fmt(s('decompN'))+' '+plural(s('decompN'),'списание','списания','списаний')+', ' : ''}Ozon забрал компенсацию обратно</small>`, v:s('compOut'), src:'decomp'}] : [])
  ] : [];
  return {list, lines, comp, usnComp, gross:s('gross'), vat:s('vat'), base:s('base'), usn:s('usn'), vr, tr, fromReport};
}
function taxDetail(key, kind){
  const months = key.split(','), C = taxCalc(months);
  if(!C.list.length) return;
  const period = months.length===1 ? monthName(months[0]) : months.length===3 && months.every(m=>m.slice(0,4)===months[0].slice(0,4)) ? `${Math.ceil(Number(months[0].slice(5,7))/3)} кв. ${months[0].slice(0,4)}` : `${monthName(months[0])} — ${monthName(months[months.length-1])}`;
  const sign = v => v<0 ? '−' : '+', src = k => `<small class="muted">${esc(TAX_SRC[k])}</small>`;
  const tr_ = (t, v, note='', cls='') => `<tr class="${cls}"><td>${t}${note?'<br>'+note:''}</td><td class="r num" style="white-space:nowrap">${v}</td></tr>`;
  const rows = [
    ...C.lines.map(l => tr_(`${sign(l.v)} ${l.t}`, rub(Math.abs(l.v)), src(l.src))),
    tr_(`<b>= Продажи с НДС</b>`, `<b>${rub(C.gross)}</b>`, '', 'tot'),
    ...(C.vr ? [tr_(`<b>НДС ${C.vr}%</b> = ${rub(C.gross)} × ${C.vr} / ${100+C.vr}`, `<b>${rub(C.vat)}</b>`, '<small class="muted">НДС уже внутри цены продажи, поэтому берём его долю, а не 5% сверху</small>', kind==='vat'?'hl':'')] : []),
    ...(kind==='usn' ? [
      tr_(`Продажи без НДС = ${rub(C.gross)} − ${rub(C.vat)}`, rub(C.gross - C.vat)),
      ...C.comp.map(l => tr_(`${sign(l.v)} ${l.t}`, rub(Math.abs(l.v)), src(l.src) + '<br><small class="muted">возмещение ущерба, а не продажа: в доходах УСН есть, НДС с него нет</small>')),
      ...(C.comp.length ? [tr_(`<b>= Доход для УСН</b>`, `<b>${rub(C.base)}</b>`, '', 'tot')] : []),
      tr_(`<b>УСН ${C.tr}%</b> = ${rub(C.base)} × ${C.tr}%`, `<b>${rub(C.usn)}</b>`, '<small class="muted">без уменьшения на страховые взносы</small>', 'hl')] : [])
  ];
  // Сверка с официальным отчётом о реализации: те же продажи и возвраты, но по дате передачи товара покупателю
  const real = C.list.filter(([,d]) => d.real);
  const recon = real.length ? (() => {
    const rs = k => real.reduce((a,[,d]) => a + d.real[k], 0), dash = real.reduce((a,[,d]) => a + d.sales + d.returns, 0);
    const net = rs('dSeller') - rs('rSeller'), diff = dash - net;
    return `<h4 style="margin:16px 0 6px">Сверка с отчётом о реализации Ozon</h4>
    <div class="tbl-wrap"><table class="pnl"><tbody>
      ${real.map(([m,d]) => tr_(`Отчёт № ${esc(d.real.number)} от ${dateRu(d.real.date,{day:'numeric',month:'long',year:'numeric'})} <small class="muted">за ${monthName(m)}</small>`, '', `<small class="muted">реализовано ${fmt(d.real.dQty)} шт на ${rub(d.real.dSeller)} (оплатили покупатели ${rub(d.real.dBuyer)} + баллы Ozon ${rub(d.real.dBonus)}${d.real.dPartner?` + программы партнёров ${rub(d.real.dPartner)}`:''}); возвращено ${fmt(d.real.rQty)} шт на ${rub(d.real.rSeller)}</small>`)).join('')}
      ${tr_('Продажи минус возвраты по отчёту о реализации', rub(net))}
      ${tr_('То же по начислениям Ozon (в расчёте выше)', rub(dash))}
      ${Math.abs(diff) < 1 ? tr_('<b>Разница</b>', '<b class="up">0 ₽</b>', '<small class="muted">суммы в расчёте совпадают с отчётом о реализации Ozon до рубля</small>') : tr_(`<b>Разница</b>`, `<b class="${Math.abs(diff) > Math.abs(net)*0.03 ? 'down' : ''}">${diff>0?'+':''}${rub(diff)}</b>`, `<small class="muted">${net ? String(Math.round(diff/net*1000)/10).replace('.',',') : 0}% · начисления идут по дате операции, отчёт о реализации — по дате передачи товара покупателю, поэтому часть продаж на стыке месяцев попадает в соседний месяц. Разница больше 3% выделена красным — такой месяц стоит проверить.</small>`)}
    </tbody></table></div>`;
  })() : `<p class="muted" style="font-size:12px;margin-top:12px">Отчёта о реализации за этот период пока нет: Ozon формирует его в первые дни следующего месяца.</p>`;
  const docs = [...new Set([...C.lines.map(l=>l.src), ...(kind==='usn' ? C.comp.map(l=>l.src) : []), ...(real.length?['real']:[])])].filter(k=>k!=='own');
  modal(`${kind==='vat' ? `НДС ${C.vr}%` : `УСН ${C.tr}%`} за ${period}: как посчитано`, `
    <div class="tbl-wrap"><table class="pnl taxcalc"><tbody>${rows.join('')}</tbody></table></div>
    ${recon}
    <h4 style="margin:16px 0 6px">Отчёты, из которых взяты суммы</h4>
    <ul style="margin:0 0 10px 18px;font-size:13px;line-height:1.6">${docs.map(k=>`<li>${esc(TAX_SRC[k])}</li>`).join('')}</ul>
    <button type="button" class="btn pri" data-taxdl="${key}|${kind}">${ic('download')}Скачать расчёт и отчёты (Excel)</button>
    <p class="muted" style="font-size:12px;margin-top:8px">В файле — лист «Расчёт» с этой формулой и по каждому месяцу листы с данными Ozon по каждому артикулу: отчёт о реализации, начисления${C.lines.some(l=>l.src==='mb')?', выкупы Ozon':''}. Оригиналы отчётов с подписью Ozon — в кабинете: «Финансы → Документы».</p>`);
}
function downloadTaxDocs(key, kind){
  const months = key.split(','), C = taxCalc(months), N = {n:'sum', w:16}, Q = {n:'qty', w:10};
  const calc = [
    ...C.lines.map(l => [l.t.replace(/<[^>]+>/g,''), Math.round(l.v*100)/100, TAX_SRC[l.src]]),
    ['= Продажи с НДС', C.gross, ''],
    ...(C.vr ? [[`НДС ${C.vr}% = продажи × ${C.vr} / ${100+C.vr}`, C.vat, '']] : []),
    ['Продажи без НДС = продажи − НДС', C.gross - C.vat, ''],
    ...C.comp.map(l => [l.t.replace(/<[^>]+>/g,''), Math.round(l.v*100)/100, TAX_SRC[l.src]]),
    ['Доход для УСН', C.base, ''],
    [`УСН ${C.tr}% = доход для УСН × ${C.tr}%`, C.usn, 'без уменьшения на страховые взносы']
  ];
  const tables = [{name:'Расчёт', cols:[{t:'Статья', w:60}, N, {t:'Источник', w:55}].map((c,i)=>i===1?{...c,t:'Сумма, ₽'}:c), rows:calc}];
  for(const [m, d] of C.list){
    const f = d.files || {};
    if(f.real) tables.push({name:`Реализация ${m}`, cols:[{t:'Артикул',w:18},{t:'Товар',w:50},{...Q,t:'Реализовано, шт'},{...N,t:'По цене продавца, ₽'},{...N,t:'Оплатили покупатели, ₽'},{...N,t:'Баллы Ozon, ₽'},{...N,t:'Программы партнёров, ₽'},{...Q,t:'Возвращено, шт'},{...N,t:'Возвраты по цене продавца, ₽'},{...N,t:'Возвраты: покупатели, ₽'},{...N,t:'Возвраты: баллы, ₽'},{...N,t:'Возвраты: партнёры, ₽'}], rows:f.real});
    if(f.acc) tables.push({name:`Начисления ${m}`, cols:[{t:'Артикул',w:18},{t:'Товар',w:50},{...Q,t:'Продано, шт'},{...N,t:'Продажи, ₽'},{...Q,t:'Возвращено, шт'},{...N,t:'Возвраты, ₽'}], rows:f.acc});
    if(f.comp) tables.push({name:`Компенсации ${m}`, cols:[{t:'Дата начисления',w:16},{t:'Тип начисления Ozon',w:30},{...N,t:'Сумма, ₽ (минус — декомпенсация)',w:22}], rows:f.comp});
    if(f.mb) tables.push({name:`Выкупы Ozon ${m}`, cols:[{t:'Артикул',w:18},{t:'Товар',w:50},{...Q,t:'Количество, шт'},{...N,t:'Цена продавца, ₽'},{...N,t:'Сумма по цене продавца, ₽'},{...N,t:'Ozon выплатил, ₽'}], rows:f.mb});
  }
  try{
    const bytes = SupplyXlsx.buildTables(tables);
    const file = `${kind==='vat'?'НДС':'УСН'} ${months.length===1?months[0]:months[0]+'—'+months[months.length-1]} расчёт и отчёты Ozon.xlsx`;
    const url = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})), a = document.createElement('a');
    a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast(`Файл скачан: ${tables.length} ${plural(tables.length,'лист','листа','листов')}`);
  }catch(e){ toast('Не удалось сформировать файл: '+e.message); }
}

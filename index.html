// Поставки по кластерам Ozon — как «Планирование» и «Сборочный лист» в шаблоне STPulse.
// Спрос на день = заказы с доставкой в кластер за 28 дней / 28 (или среднесуточные продажи Ozon);
// потребность = спрос × запас дней − доступно − в пути; подсорт — положительная потребность.
function clusterCalc(){
  const C = E().clusters || {rows:[], days:28};
  const days = state.clDays, withFbs = state.clFbs, withTransit = state.clTransit, byOzon = state.clDemand==='ozon' || !C.ordersKnown;
  const cells = C.rows.map(r => {
    const local = r.fboLocal + (withFbs ? r.fbsLocal : 0), far = r.fboFar + (withFbs ? r.fbsFar : 0);
    const daily = byOzon ? r.ads : (local + far) / (C.days || 28);
    const need = daily > 0 ? daily * days - r.available - (withTransit ? r.transit : 0) : -r.available;
    const auto = daily > 0 ? Math.max(0, Math.ceil(need)) : 0, key = r.cluster + '|' + r.offer;
    const own = state.clEdit[key];
    return {...r, key, local, far, orders: local + far, daily, turnover: daily > 0 ? Math.round(r.available / daily) : null, need: Math.round(need), auto, edited: own !== undefined, podsort: own !== undefined ? own : auto};
  });
  // Ручной подсорт для пары «кластер — артикул», которой нет в данных Ozon (товар ещё не возили в этот кластер)
  const have = new Set(cells.map(c => c.key)), info = {};
  for(const r of C.rows) info[r.offer] = info[r.offer] || r;
  for(const [key, v] of Object.entries(state.clEdit)){
    if(have.has(key)) continue;
    const i = key.indexOf('|'), cluster = key.slice(0, i), offer = key.slice(i + 1), base = info[offer] || {name: offer, category: 'Без категории'};
    cells.push({offer, cluster, key, name: base.name, category: base.category, available: 0, transit: 0, ads: 0, local: 0, far: 0, orders: 0, daily: 0, turnover: null, need: 0, auto: 0, edited: true, podsort: v});
  }
  const clusters = {};
  for(const c of cells){ const k = clusters[c.cluster] = clusters[c.cluster] || {name:c.cluster, orders:0, available:0, local:0, far:0, need:0, podsort:0, transit:0}; k.orders += c.orders; k.available += c.available; k.local += c.local; k.far += c.far; k.podsort += c.podsort; k.need += Math.max(0, c.need); k.transit += c.transit; }
  const totalOrders = Object.values(clusters).reduce((s,k)=>s+k.orders,0);
  const list = Object.values(clusters).filter(k => k.orders || k.available || k.podsort).sort((a,b)=>b.orders-a.orders || b.available-a.available);
  list.forEach(k => k.share = totalOrders ? k.orders/totalOrders*100 : 0);
  return {C, cells, clusters:list, byOzon};
}
// Excel сборочного листа для загрузки в поставку Ozon: один кластер или все (каждый — отдельный лист).
// Учитываются текущие настройки раздела: запас дней, FBS-заказы, товары в пути, поиск.
async function downloadSupply(which){
  const {cells, clusters} = clusterCalc(), q = state.clQ.toLowerCase();
  const list = clusters.filter(k => k.podsort > 0 && (which==='*' || k.name===which)).map(k => ({
    name: k.name,
    items: cells.filter(c => c.cluster===k.name && c.podsort>0 && (!q || (c.offer+' '+c.name).toLowerCase().includes(q))).sort((a,b)=>a.offer.localeCompare(b.offer)).map(c => ({offer:c.offer, name:c.name, qty:c.podsort}))
  })).filter(k => k.items.length);
  if(!list.length){ toast('Нет товаров для поставки'); return; }
  const file = `Поставка ${which==='*' ? 'все кластеры' : which} ${TODAY_ISO}.xlsx`.replace(/[\\/:*?"<>|]/g, ' ');
  try{
    // Файл по шаблону Ozon собирается прямо в браузере — работает и без сервера (в файле index.html)
    const bytes = SupplyXlsx.build(list);
    if(!bytes) throw new Error('нет товаров');
    const url = URL.createObjectURL(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})), a = document.createElement('a');
    a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast(`Файл скачан: ${list.length} ${plural(list.length,'кластер','кластера','кластеров')}, ${fmt(list.reduce((s,k)=>s+k.items.reduce((t,i)=>t+i.qty,0),0))} шт`);
  }catch(e){ toast('Не удалось сформировать файл: '+e.message); }
}

  let body;

// Строки цены: исходные данные с сервера + параметры страницы, которые пересчитываются сразу.
function priceRows(){
  const P = pricingParams();
  return (E().pricing || []).map(r => {
    const own = r.src?.type ? P.packaging?.[r.src.type] : undefined;
    const packaging = own !== undefined && own !== null ? Number(own) || 0 : Number(P.packDefault) || 0;
    const input = {...r.input, acquiringPct:P.acquiringPct, drrPct:P.drrPct, extraPct:P.extraPct, targetMarginPct:P.targetMarginPct, vatPct:P.vatPct, packaging, ozonPack:Number(P.ozonPack)||0};
    return {...r, input, ...Pricing.calcPrice(input)};
  });
}

}

// Расшифровка цены. mode: cur — по текущей цене, min, rec, own — своя цена (state.pdPrice).
function priceDetail(offer, mode){
  const r = priceRows().find(x=>x.offer===offer); if(!r) return;
  if(!r.costKnown && usesShopData()) { if(SERVER.on && !SERVER.snapshot) costModal(offer); return; }
  if(offer !== state.pdOffer){ state.pdOffer = offer; state.pdPrice = null; }
  if(mode) state.pdMode = mode;
  if(!state.pdMode || (state.pdMode==='cur' && !r.input.currentPrice)) state.pdMode = r.input.currentPrice ? 'cur' : 'rec';
  const byMode = {cur:r.input.currentPrice, min:r.min, rec:r.rec, own:state.pdPrice};
  const price = byMode[state.pdMode] || r.input.currentPrice || r.rec || r.min || 0;
  if(state.pdPrice === null) state.pdPrice = price;
  const i = r.input, b = Pricing.breakdown(price, i);
  const srcT = {fact:'факт по товару', avg:'средняя по магазину', tariff:'средний тариф Ozon', ozon:'тариф Ozon', default:'по умолчанию'};
  const tarNote = r.src?.logistics==='tariff' && r.src.tariffMin ? ` (от ${rub(r.src.tariffMin)} до ${rub(r.src.tariffMax)})` : '';
  const sold = r.src?.sold || 0, ret = r.src?.returned || 0;
  const retNote = r.src?.returnRate==='fact' ? `факт: ${fmt(ret)} возвр. из ${fmt(sold+ret)} шт` : 'новый товар — без продаж';
  const btn = (m, t, v) => `<button type="button" class="btn sm ${state.pdMode===m?'pri':''}" data-pdmode="${m}" ${v?'':'disabled'}>${t}${v?' · '+rub(v):''}</button>`;
  const profit = Pricing.profitAt(price, i);
  // Факт: по начислениям Ozon за выбранный период (как в «Юнит-экономике»), на 1 проданную штуку (выкупы − возвраты).
  const e = E(), periods = [...(e.months||[]).filter(m => e.unit?.[m]), ...(e.unit?.all ? ['all'] : [])];
  const unitOf = m => (e.unit?.[m] || []).find(u => u.offer === offer);
  const units = u => u ? u.buyQty - u.retQty : 0;
  if(!state.pdFact || !periods.includes(state.pdFact) || offer !== state.pdFactOffer){ state.pdFactOffer = offer; state.pdFact = periods.find(m => m!=='all' && units(unitOf(m)) > 0) || 'all'; }
  const fu = unitOf(state.pdFact), n = units(fu);
  const F = n > 0 ? (() => {
    const c = k => (fu.cols?.[k] || 0) / n;
    const priceF = (fu.buyRev - fu.retRev) / n, comm = fu.commission / n, acq = c('acquiring');
    const log = c('logistics') + c('lastMile') + c('processing'), ret = c('returnProcessing') + c('returnLogistics');
    const pack = c('packing');
    const other = fu.payout / n - priceF - comm - acq - log - ret - pack;   // размещение, утилизация и прочие удержания
    return { price: priceF, commission: comm, acquiring: acq, logistics: log, returns: ret, pack, other, vat: -(fu.vat||0)/n, tax: -(fu.tax||0)/n, ads: -(fu.ads||0)/n, cost: -fu.cost/n, profit: fu.profit/n, margin: fu.margin };
  })() : null;
  const f = k => F ? F[k] : null, NA = '<span class="muted">—</span>';
  const money = v => v === null || v === undefined ? NA : `<b class="num ${v<0?'':'up'}">${rub(Math.round(v) === 0 ? 0 : v)}</b>`;
  const lines = [
    ['Цена продажи', price, F ? F.price : null, F ? 'средняя: выручка ÷ проданные штуки' : ''],
    ['Комиссия Ozon ('+p1(i.commissionPct)+')', b.commission, f('commission')],
    ['Эквайринг ('+p1(i.acquiringPct)+')', b.acquiring, f('acquiring')],
    [`Логистика до покупателя <small class="muted">${srcT[r.src?.logistics]||''}${tarNote}</small>`, b.logistics, f('logistics')],
    [`Возвраты (${p1(i.returnRatePct)}) <small class="muted">${retNote}; обратно ${rub(i.returnCost)}</small>`, b.returns, f('returns')],
    [`Переупаковка Ozon <small class="muted">материалы для упаковки + упаковка партнёрами</small>`, b.ozonPack, f('pack')],
    ...(F && Math.round(F.other) ? [[`Прочие удержания Ozon <small class="muted">размещение, утилизация и др.</small>`, null, f('other')]] : []),
    [`Своя упаковка <small class="muted">${esc(r.src?.type||'')}</small>`, b.packaging, null, 'в факте не учитывается'],
    ...(i.extraPct ? [['Доп. расходы ('+p1(i.extraPct)+')', b.extra, null, 'в факте не учитывается']] : []),
    ...(i.drrPct || (F && F.ads) ? [['Реклама', b.drr, F && F.ads ? F.ads : null]] : []),
    ...(i.vatPct ? [[`НДС ${p1(i.vatPct)} <small class="muted">внутри цены</small>`, b.vat, f('vat')]] : []),

function purchaseModal(id){

  modal(id ? 'Закупка' : 'Новая закупка', `
    <datalist id="offers">${known.map(([o,n])=>`<option value="${esc(o)}">${esc(n)}</option>`).join('')}</datalist>
    <div class="fld2"><div class="fld"><label>Артикул продавца</label><input type="text" name="offer" list="offers" value="${esc(p.offer)}"></div>
    <div class="fld"><label>Дата</label><input type="date" name="date" value="${p.date||TODAY_ISO}"></div></div>

    <div class="fld2"><div class="fld"><label>Количество, шт</label><input type="number" name="qty" min="1" step="1" value="${p.qty}"></div>
    <div class="fld"><label>Цена за 1 шт, ₽</label><input type="number" name="price" min="0" step="0.01" value="${p.price}"></div></div>
    <div class="fld2"><div class="fld"><label>Доставка и прочие расходы на всю партию, ₽</label><input type="number" name="extra" min="0" step="0.01" value="${p.extra}"></div>

async function savePricingParam(k, v){
  const P = pricingParams(); P[k] = k==='scheme' || k==='logisticsMode' ? v : Number(v);
  if(!SERVER.on){ store.set('pricing', P); render(); return; }
  SERVER.econ.pricingParams = P; render();
  try{ await api('POST', '/api/pricing/params', {[k]: P[k]}); if(await loadLive()) render(); }catch(e){ toast('Не удалось сохранить: '+e.message); }
}
// Упаковка по типу товара, ₽ за штуку
async function savePackaging(type, v){
  const P = pricingParams(), val = String(v).trim()==='' ? null : Math.max(0, Number(String(v).replace(',','.'))||0);
  P.packaging = {...(P.packaging||{})}; if(val===null) delete P.packaging[type]; else P.packaging[type] = val;
  if(!SERVER.on){ store.set('pricing', P); render(); return; }
  SERVER.econ.pricingParams = P; render();
  try{ await api('POST', '/api/pricing/params', {packaging:{[type]: val}}); if(await loadLive()) render(); }catch(e){ toast('Не удалось сохранить: '+e.message); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-purchase],[data-delpurchase],[data-delpnl],[data-price],[data-received],[data-stockf],[data-pnlm],[data-pdmode],[data-cltab],[data-clcopy],[data-cldl],[data-clreset],[data-rnptab],[data-rnpgrp],[data-taxyear],[data-retgroup],[data-taxinfo],[data-taxdl]');
  if(!t || e.target.closest('a,[data-act="setCost"]')) return;
  const d = t.dataset;
  if(d.taxinfo){ const [k, kind] = d.taxinfo.split('|'); taxDetail(k, kind); return; }
  if(d.taxdl){ const [k, kind] = d.taxdl.split('|'); downloadTaxDocs(k, kind); return; }
  if(d.retgroup){ state.retGroup = state.retGroup===d.retgroup ? 'problems' : d.retgroup; render(); return; }
  if(d.taxyear){ state.taxYear = d.taxyear; render(); return; }
  if(d.rnptab){ state.rnpTab = d.rnptab; render(); return; }
  if(d.rnpgrp){ const g = d.rnpgrp; state.rnpClosed = state.rnpClosed.includes(g) ? state.rnpClosed.filter(x=>x!==g) : [...state.rnpClosed, g]; render(); return; }
  if(d.clreset){ if(confirm('Сбросить все ваши правки подсорта и вернуть расчётные количества?')){ state.clEdit = {}; store.set('clEdit', {}); render(); } return; }
  if(d.cltab){ state.clTab = d.cltab; render(); return; }
  if(d.cldl){ downloadSupply(d.cldl); return; }
  if(d.clcopy){
    // Сборочный лист кластера в буфер: «артикул — количество» через табуляцию, чтобы вставить в Excel/Google Таблицы
    const lines = clusterCalc().cells.filter(c=>c.cluster===d.clcopy && c.podsort>0).sort((a,b)=>a.offer.localeCompare(b.offer)).map(c=>`${c.offer}\t${c.podsort}`);
    navigator.clipboard.writeText(`${d.clcopy}\nартикул\tколичество\n${lines.join('\n')}`).then(()=>toast('Скопировано: '+lines.length+' строк'), ()=>toast('Не удалось скопировать'));
    return;
  }
  if(d.pdmode){ priceDetail(state.pdOffer, d.pdmode); return; }
  if(d.price){ state.pdOffer = null; priceDetail(d.price, d.pmode || 'cur'); return; }
  if(d.purchase) purchaseModal(d.purchase);
  else if(d.delpurchase){ if(confirm('Удалить закупку?')){ state.purchases = state.purchases.filter(x=>x.id!==d.delpurchase); closeModal(); save('purchases'); render(); } }
  else if(d.delpnl){ state.pnl = state.pnl.filter(x=>x.id!==d.delpnl); save('pnl'); render(); }
  else if(d.price) priceDetail(d.price);
  else if(d.received){ const p = state.purchases.find(x=>x.id===d.received); p.status='Получено'; save('purchases'); render(); toast('Поставка отмечена полученной'); }
  else if(d.stockf){ state.stockF = d.stockf; render(); }
  else if(d.pnlm){ state.econMonth = d.pnlm; render(); }
});
document.addEventListener('change', e => {

  if(d.rnpfrom !== undefined){ state.rnpFrom = e.target.value; render(); }

  if(d.rnpmet !== undefined){ state.rnpMet = e.target.value; render(); }

  if(d.cledit !== undefined){

function shopDataStatus(){

function render(){

  const keep = [...document.querySelectorAll('#view .tbl-wrap.fix')].map(w => [w.scrollTop, w.scrollLeft]);

/* ---------- modal ---------- */
function modal(title, body, onSave, extra=''){
  $('#modal').innerHTML = `<h3>${title}<button data-act="close" aria-label="Закрыть">${ic('x')}</button></h3><form id="mf">${body}<div class="err" id="merr"></div><div class="mact">${extra}<button type="button" class="btn" data-act="close">Отмена</button>${onSave?'<button class="btn pri">Сохранить</button>':''}</div></form>`;
  $('#ov').classList.add('show');
  const f = $('#mf');
  f.onsubmit = e => { e.preventDefault(); const r = onSave && onSave(Object.fromEntries(new FormData(f))); if(r) $('#merr').textContent = r; else closeModal(); };
  setTimeout(()=>{ const el = f.querySelector('input,textarea'); el && el.focus(); }, 30);
}
function closeModal(){ $('#ov').classList.remove('show'); }
function costButton(offer){
  return SERVER.on && !SERVER.snapshot ? `<button type="button" class="btn sm" data-act="setCost" data-arg="${esc(offer)}">Указать себестоимость</button>` : '—';
}
function missingCostsNotice(offers){
  return `<div class="note"><b>Укажите себестоимость для ${fmt(offers.length)} арт.</b> Прибыль за период будет рассчитана после заполнения.

    <details><summary>Артикулы без себестоимости</summary>${offers.map(offer=>`<div class="row"><span>${esc(offer)}</span>${costButton(offer)}</div>`).join('')}</details></div>`;
}
function costModal(offer){
  modal('Себестоимость за штуку', `<div class="fld"><label>Артикул ${esc(offer)}</label><input name="unitCost" type="number" min="0.01" max="1000000000" step="0.01" required></div>`);
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const form = e.currentTarget, submit = form.querySelector('button[type=submit]');
    const unitCost = Number(new FormData(form).get('unitCost'));
    if(submit) submit.disabled = true;
    try {
      await api('POST', '/api/costs', {offer, unitCost});

function taskModal(id, preset={}){
  const t = state.tasks.find(x=>x.id===id) || {title:'',desc:'',pr:'med',due:TODAY_ISO,who:DEMO.owner,status:'todo',...preset};
  const doc = t.doc && state.docs.find(x=>x.id===t.doc);
  modal(id?'Задача':'Новая задача', `
    ${doc ? `<div class="note" style="margin-bottom:12px">Документ: ${doc.hasFile ? `<a href="/api/docs/${encodeURIComponent(doc.id)}/file" target="_blank" rel="noopener">${esc(doc.name)}</a>` : esc(doc.name)}${doc.ai?.summary ? '<br>'+esc(doc.ai.summary) : ''}</div>` : ''}
    <div class="fld"><label>Название</label><input type="text" name="title" value="${esc(t.title)}"></div>
    <div class="fld"><label>Описание</label><textarea name="desc" rows="3">${esc(t.desc)}</textarea></div>
    <div class="fld2"><div class="fld"><label>Приоритет</label><select name="pr">${opt([['high','Высокий'],['med','Средний'],['low','Низкий']],t.pr)}</select></div>
    <div class="fld"><label>Срок</label><input type="date" name="due" value="${t.due}"></div></div>
    <div class="fld2"><div class="fld"><label>Исполнитель</label><select name="who">${opt(DEMO.people,t.who)}</select></div>
    <div class="fld"><label>Статус</label><select name="status">${opt([['todo','К выполнению'],['doing','В работе'],['done','Готово']],t.status)}</select></div></div>`,
    v => {
      if(!v.title.trim()) return 'Введите название задачи';
      if(!v.due) return 'Укажите срок';
      if(id) Object.assign(t, v, {title:v.title.trim()});
      else state.tasks.unshift({id:uid(), ai:false, ...preset, ...v, title:v.title.trim()});
      save('tasks'); render(); toast(id?'Задача сохранена':'Задача создана');
    }, id?`<button type="button" class="btn danger l" data-act="delTask" data-arg="${id}">Удалить</button>`:'');
}
/* ---------- запросы к серверу и синхронизация ---------- */
async function api(method, url, body){
  if(SERVER.snapshot) throw new Error('это снимок данных — изменения сохраняются только при запущенном сервере');
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Сервер не ответил');
  return j;
}
async function syncNow(){
  if(SERVER.snapshot){ toast('Это снимок данных — чтобы обновить, запустите сервер и скачайте файл заново'); return; }
  if(!SERVER.on){ state.lastSync = new Date(); render(); toast('Сервер не запущен — показаны демо-данные'); return; }
  try{ await api('POST', '/api/sync'); }catch(e){ toast(e.message); return; }
  SERVER.syncing = SERVER.mode !== 'test'; render(); toast(SERVER.syncing ? 'Синхронизация запущена' : 'Тестовые данные пересчитаны');
  for(let i=0; i<100 && SERVER.syncing; i++){ await new Promise(r=>setTimeout(r,3000)); await loadLive(); }
  const loaded = await loadLive();
  render();
  if(!loaded){ toast('Не удалось проверить результат синхронизации'); return; }
  if(SERVER.syncing){ toast('Синхронизация ещё идёт'); return; }
  const ozon = SERVER.integrations?.find(source=>source.id==='ozon');
  if(ozon?.status==='error'){ toast('Ozon: ' + (ozon.error || 'ошибка синхронизации')); return; }
  if(ozon?.error){ toast('Ozon: часть данных не загрузилась. Подробности в интеграциях'); return; }
  toast('Данные обновлены');
}

/* ---------- toast ---------- */
let tt;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2600); }

/* ---------- search ---------- */
function search(q){
  const box = $('#sres'); q = q.trim().toLowerCase();
  if(!q){ box.classList.remove('show'); return; }
  const r = [];
  NAV.forEach(n => n.t.toLowerCase().includes(q) && r.push({t:n.t, s:'Раздел', go:n.k}));
  'документы'.includes(q) && r.push({t:'Все документы', s:'Раздел', go:'docs'});
  state.tasks.forEach(t => t.title.toLowerCase().includes(q) && r.push({t:t.title, s:'Задача', task:t.id}));
  state.purchases.forEach(p => (p.offer+' '+(p.name||'')+' '+(p.supplier||'')).toLowerCase().includes(q) && r.push({t:`${p.offer} · ${p.name||''} — ${p.supplier||'закупка'}`, s:'Закупка', go:'purchases'}));
  state.docs.forEach(d => (d.name+' '+d.who).toLowerCase().includes(q) && r.push({t:d.name, s:'Документ', doc:d.name}));
  DEMO.skus.forEach(s => (s.sku+' '+s.name).toLowerCase().includes(q) && r.push({t:`Арт. ${s.sku} · ${s.name}`, s:'Артикул', go:'analytics'}));
  box.innerHTML = r.slice(0,10).map((x,i)=>`<button data-sr="${i}">${esc(x.t)}<small>${x.s}</small></button>`).join('') || '<div class="empty">Ничего не найдено</div>';
  box._r = r; box.classList.add('show');
}

/* ---------- AI chat (демо-ответы по демо-данным) ---------- */
function botAnswer(q){
  q = q.toLowerCase();
  const tc = taskCounts(), gap = cashGap(), p = DEMO.plan;
  if(/выруч|продаж/.test(q)) return `Выручка за месяц: ${rub(p.fact)} (+12% к прошлому). Это ${Math.round(p.fact/p.target*100)}% плана ${rub(p.target)}. Прогноз на конец месяца — ${rub(p.forecast)}.`;
  if(/должен|дебитор/.test(q)) return `Вам должны ${rub(DEMO.receivables.total)}. Просрочили оплату ${DEMO.receivables.overdueClients} клиента на ${rub(DEMO.receivables.overdueSum)}.\nЕсли их напомнить сейчас, это закроет кассовый разрыв, который ожидается после зарплаты.`;
  if(/прибыл|марж/.test(q)) return `Чистая прибыль: ${rub(DEMO.kpi[1].value)}, маржа ${DEMO.kpi[2].value}%.\nПо каналам: ${DEMO.channels.map(c=>c.name+' '+c.margin+'%').join(', ')}. Подробно по артикулам — в разделе «Юнит-экономика».`;
  if(/деньг|касс|разрыв|счет|счёт|баланс/.test(q)) return `На счетах ${rub(DEMO.cash.balance)}.` + (gap ? `\nПо прогнозу ${dateRu(gap.date)} баланс уйдёт в минус (${rub(gap.v)}) — после оплаты поставщику и зарплаты. Решение в Центре решений: «Закрыть кассовый разрыв».` : '\nКассовых разрывов в ближайшие 30 дней не видно.');
  if(/задач|дел/.test(q)) return `Открытых задач: ${tc.open}, на сегодня: ${tc.today}, просрочено: ${tc.late}.\n` + state.tasks.filter(t=>isOpen(t)&&t.due<=TODAY_ISO).map(t=>'• '+t.title+' — '+t.who).join('\n');
  if(/цен|минимальн|убыт/.test(q)){ const b = priceRows().filter(r=>r.belowMin && r.costKnown); return b.length ? 'Ниже минимальной цены: ' + b.map(r=>`арт. ${r.offer} — сейчас ${rub(r.input.currentPrice)}, минимум ${rub(r.min)}`).join('; ') + '.' : 'Все товары продаются не ниже минимальной цены.'; }
  if(/документ|подпис|акт/.test(q)){ const s = state.docs.filter(d=>d.status==='Ждёт подписи'); return `Ждут подписи: ${s.length}.\n` + s.map(d=>'• '+d.name+' — '+d.who).join('\n'); }
  if(/реклам|дрр|кампан/.test(q)) return `ДРР за месяц ${String(DEMO.drr.value).replace('.',',')}% при пороге ${DEMO.drr.limit}%.\nВыше порога: ` + DEMO.campaigns.filter(c=>c.drrW>DEMO.drr.limit).map(c=>`«${c.name}» (${String(c.drrW).replace('.',',')}% за неделю)`).join(', ') + '.';
  if(/склад|остат|дозаказ|артикул/.test(q)) return 'Заканчиваются (меньше 14 дней): ' + DEMO.skus.filter(s=>s.stock/(s.sold/28)<14).map(s=>`арт. ${s.sku} — ${Math.round(s.stock/(s.sold/28))} дн.`).join(', ') + '.';
  if(/отчёт|отчет|сводк/.test(q)) return report();
  return 'Пока я отвечаю по демо-данным: выручка, прибыль, деньги и кассовый разрыв, задачи, документы, реклама, склад, цены. Настоящий ИИ по живым данным подключим на этапе 3.';
}
function report(){
  const tc = taskCounts(), gap = cashGap();
  return `Сводка на ${dateRu(TODAY_ISO)}:\n• Выручка ${rub(DEMO.plan.fact)} — ${Math.round(DEMO.plan.fact/DEMO.plan.target*100)}% плана\n• Прибыль ${rub(DEMO.kpi[1].value)}, маржа ${DEMO.kpi[2].value}%\n• На счетах ${rub(DEMO.cash.balance)}${gap?`, разрыв ${dateRu(gap.date)}`:''}\n• Задачи: ${tc.open} открыто, ${tc.late} просрочено\n• Решений ждут: ${state.decisions.filter(d=>d.status==='new').length}`;
}
function addMsg(t, who){ const m=document.createElement('div'); m.className='msg '+who; m.textContent=t; $('#msgs').appendChild(m); $('#msgs').scrollTop=1e9; }
// С подключённым Claude отвечает настоящий ИИ по данным с сервера, без него — встроенные демо-ответы.
const chatAI = () => SERVER.on && SERVER.ai;
const chatLog = [];
let chatBusy = false;
async function ask(q){
  addMsg(q,'me');
  if(!chatAI()){ setTimeout(()=>addMsg(usesShopData() ? 'ИИ-ассистент пока не подключён.' : botAnswer(q),'bot'), 350); return; }
  if(chatBusy){ toast('Подождите ответа на прошлый вопрос'); return; }
  chatBusy = true;
  chatLog.push({role:'user', text:q});
  const m = document.createElement('div'); m.className = 'msg bot'; m.textContent = 'Думаю…'; m.style.opacity = '.6';
  $('#msgs').appendChild(m); $('#msgs').scrollTop = 1e9;
  try{
    const r = await api('POST', '/api/chat', {messages: chatLog});
    chatLog.push({role:'assistant', text:r.text});
    m.textContent = r.text; m.style.opacity = '';
  }catch(e){
    chatLog.pop();
    m.textContent = 'Не получилось ответить: '+e.message; m.style.opacity = '';
  }finally{ chatBusy = false; $('#msgs').scrollTop = 1e9; }
}
function openChat(q){
  $('#chat').classList.add('show');
  $('#chat header small').textContent = chatAI() ? 'Claude · отвечает по данным дашборда' : usesShopData() ? 'Ассистент не подключён' : 'Демо-режим: ответы по демо-данным';
  if(!$('#msgs').children.length){ addMsg(chatAI() ? `Здравствуйте, ${DEMO.owner}! Спрашивайте про выручку, прибыль, остатки, цены, задачи и документы — отвечу по данным дашборда.` : usesShopData() ? 'ИИ-ассистент пока не подключён.' : `Здравствуйте, ${DEMO.owner}! Сейчас я отвечаю по демо-данным.`, 'bot'); }
  $('#sugg').innerHTML = ['Сколько выручки?','Будет кассовый разрыв?','Что на сегодня?','Какая реклама не окупается?'].map(s=>`<button data-ask="${s}">${s}</button>`).join('');
  if(q) ask(q); else setTimeout(()=>$('#chatIn').focus(), 260);
}

async function recalcDecisions(){
  if(!SERVER.on){ refreshDecisions(); render(); toast('Решения пересчитаны по демо-данным'); return; }
  try{ await api('POST', '/api/decisions/recalc'); }catch(e){ toast('Не удалось запустить расчёт: '+e.message); return; }
  SERVER.decMeta = {...SERVER.decMeta, running:true}; render();
  toast(SERVER.ai ? 'ИИ готовит решения — это займёт до пары минут' : 'Считаю решения по встроенным правилам');
  for(let i=0; i<80; i++){ await new Promise(r=>setTimeout(r,2500)); await loadLive(); if(!SERVER.decMeta?.running) break; }
  state.decTab = 'new'; render();
  const M = SERVER.decMeta || {};
  toast(M.error ? 'ИИ не ответил — решения посчитаны встроенными правилами' : `Готово: новых решений — ${state.decisions.filter(d=>d.status==='new').length}`);
}
function decisionAction(a, id){
  const d = state.decisions.find(x=>x.id===id);
  if(a==='accept'){
    d.steps.forEach((s,i)=>state.tasks.push({id:uid(), title:s, desc:'Шаг решения: '+d.title, status:'todo', pr:d.urg==='Сегодня'?'high':'med', due:d.due, who:DEMO.owner, ai:true, decision:d.id, step:i}));
    d.status='doing'; d.decidedAt=TODAY_ISO; save('tasks'); save('decisions'); render(); toast(`Создано задач: ${d.steps.length}`);
  } else if(a==='postpone'){ d.status='postponed'; d.until=day(3); d.decidedAt=TODAY_ISO; save('decisions'); render(); toast('Отложено на 3 дня'); }
  else if(a==='restore'){ d.status='new'; delete d.reason; delete d.decidedAt; save('decisions'); render(); }
  else if(a==='discuss'){ openChat(chatAI() ? `Обсудим решение «${d.title}». Ситуация: ${d.situation} Предложение: ${d.why} Шаги: ${d.steps.join('; ')}. Стоит ли его принимать и какие есть риски?` : `Обсудим решение «${d.title}». Почему это важно?`); if(!chatAI()) setTimeout(()=>addMsg(`${d.situation}\n\n${d.why}\nЭффект: ${d.effect?'+'+rub(d.effect)+' в месяц':'снижение риска'}. Уверенность ${d.conf}%.`,'bot'), 700); }
  else if(a==='reject'){
    modal('Отклонить решение', `<p class="muted" style="margin-bottom:12px">${esc(d.title)}</p><div class="fld"><label>Почему отклоняете? ИИ учтёт это в следующий раз</label><textarea name="reason" rows="3"></textarea></div>`,
      v => { if(!v.reason.trim()) return 'Напишите причину'; d.status='rejected'; d.reason=v.reason.trim(); d.decidedAt=TODAY_ISO; save('decisions'); render(); toast('Решение отклонено'); });
  }
}

$('#fileIn').addEventListener('change', async e => {
  const files = [...e.target.files]; if(!files.length) return;
  e.target.value = '';
  if(SERVER.on){
    state.docFilter = {source:'',status:'',q:''}; go('docs');
    let ok = 0, dup = 0;
    for(const f of files){
      if(f.size > 20*1024*1024){ toast(`«${f.name}» больше 20 МБ — пропущен`); continue; }
      try{
        const r = await fetch('/api/docs/upload', {method:'POST', headers:{'Content-Type': f.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name)}, body: f});
        const j = await r.json(); if(!r.ok) throw new Error(j.error || 'ошибка');
        j.duplicate ? dup++ : ok++;
      }catch(err){ toast(`«${f.name}»: ${err.message}`); }
    }
    await loadLive(); render();
    toast(`Загружено: ${ok}${dup?`, уже были: ${dup}`:''}.${SERVER.ai && ok ? ' ИИ разбирает — статусы обновятся сами.' : ''}`);
    // Разбор идёт на сервере по очереди — подтягиваем результат несколько раз.
    if(SERVER.ai && ok) for(const s of [5,10,20,40]) setTimeout(async () => { if(await loadLive()) render(); }, s*1000);
    return;
  }
  files.forEach(f => { const ext = (f.name.split('.').pop()||'').toUpperCase().slice(0,4); state.docs.unshift({id:uid(), name:f.name, type:ext==='JPEG'?'JPG':ext||'FILE', source:'Вручную', date:TODAY_ISO, status:'Новый', who:'', amount:0}); });
  save('docs'); state.docFilter={source:'',status:'',q:''}; go('docs');
  toast(`Добавлено файлов: ${files.length}. Без сервера файлы не сохраняются и ИИ их не разбирает`);
});
$('#chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#chatIn').value.trim(); if(v){ ask(v); $('#chatIn').value=''; } });
$('#ov').addEventListener('click', e => { if(e.target.id==='ov') closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeModal(); $('#chat').classList.remove('show'); $('#sres').classList.remove('show'); closeSide(); } });
$('#burger').addEventListener('click', () => { $('#side').classList.add('open'); $('#scrim').classList.add('show'); });
$('#scrim').addEventListener('click', closeSide);

/* drag & drop для канбанов */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.kc'); if(!c) return; dragId = c.dataset.task || c.dataset.deal; c.classList.add('drag'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', e => { e.target.classList?.remove('drag'); document.querySelectorAll('.kcol.over').forEach(k=>k.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('[data-drop]'); if(!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(k=>k!==col&&k.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = e.target.closest?.('[data-drop]'); if(!col || !dragId) return; e.preventDefault();
  if(col.dataset.drop==='task'){ const x = state.tasks.find(k=>k.id===dragId); if(x){ x.status = col.dataset.status; save('tasks'); } }
  dragId = null; render();
});

/* ---------- init ---------- */
$('#brandName').textContent = DEMO.company; $('#brandTag').textContent = DEMO.tagline;
$('#burger').innerHTML = ic('menu'); document.querySelector('.search>svg').innerHTML = ICONS.search;
document.querySelector('[data-act="chatClose"]').innerHTML = ic('x'); document.querySelector('#chatForm .btn').innerHTML = ic('send');
state.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
render();
// Без сервера (файл открыт напрямую) остаётся демо-режим; с сервером — подставляем данные и обновляем раз в 5 минут.
loadLive().then(ok => {
  if(ok) render();
  if(!HAS_API || SNAPSHOT) return;
  // Раз в минуту подтягиваем изменения команды и новые документы.
  setInterval(async () => { if($('#ov').classList.contains('show') || SERVER.syncing || document.activeElement?.matches('input,textarea,select')) return; if(await loadLive()) render(); }, 60000);
});
</script>
</body>
</html>
